<title>BudgetSplit System Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Palette taken from the app's own tokens (AGENTS.md §10) rather than invented:
   this describes BudgetSplit, so it should look like BudgetSplit. Neutrals are
   biased toward the teal accent in both themes. */
:root {
  --ground:   #EEF4F2;
  --surface:  #FFFFFF;
  --raised:   #F6FAF9;
  --line:     #D6E3DF;
  --line-soft:#E6EEEC;
  --ink:      #0B1614;
  --ink-2:    #415954;
  --ink-3:    #6D8480;
  --accent:   #0E8C82;
  --accent-b: #D9F0ED;
  --flag:     #6D5CD8;
  --flag-b:   #E8E4FA;
  --warn:     #C4432F;
  --warn-b:   #FBE5E1;
  --ok:       #0F7A55;
  --ok-b:     #DCF2E8;
  --shadow:   0 1px 2px rgba(11,22,20,.06), 0 8px 24px -12px rgba(11,22,20,.18);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:   #0A0F11;
    --surface:  #13201F;
    --raised:   #182C2A;
    --line:     #21302E;
    --line-soft:#1A2827;
    --ink:      #ECF3F1;
    --ink-2:    #A3B7B3;
    --ink-3:    #7C918E;
    --accent:   #20C4B8;
    --accent-b: #10312F;
    --flag:     #9E90FA;
    --flag-b:   #221E3A;
    --warn:     #FF8071;
    --warn-b:   #35201D;
    --ok:       #2BD49B;
    --ok-b:     #103024;
    --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --ground:#0A0F11; --surface:#13201F; --raised:#182C2A; --line:#21302E; --line-soft:#1A2827;
  --ink:#ECF3F1; --ink-2:#A3B7B3; --ink-3:#7C918E;
  --accent:#20C4B8; --accent-b:#10312F; --flag:#9E90FA; --flag-b:#221E3A;
  --warn:#FF8071; --warn-b:#35201D; --ok:#2BD49B; --ok-b:#103024;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -.01em; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-variant-ligatures: none; }

/* ---------------------------------------------------------------- masthead */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
.brand span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

.find { position: relative; flex: 1 1 320px; max-width: 460px; }
.find input {
  width: 100%; padding: 9px 12px 9px 34px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-family: var(--mono); font-size: 13px;
}
.find input::placeholder { color: var(--ink-3); }
.find input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.find svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.hint { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }

.tbtn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.tbtn:hover { border-color: var(--accent); color: var(--ink); }
.tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ------------------------------------------------------------------- tabs */
.tabs { border-bottom: 1px solid var(--line); background: var(--ground); position: sticky; top: 57px; z-index: 19; }
.tabs-in { max-width: 1180px; margin: 0 auto; padding: 0 20px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; color: var(--ink-3); cursor: pointer;
  font: inherit; font-size: 13px; padding: 11px 12px; white-space: nowrap;
  border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 7px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tab .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .n { color: var(--accent); }

/* ------------------------------------------------------------------ layout */
main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 96px; }
.lede { max-width: 66ch; color: var(--ink-2); font-size: 14.5px; margin: 0 0 22px; }
.lede strong { color: var(--ink); font-weight: 600; }

.rows { display: flex; flex-direction: column; gap: 8px; }

.row {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 13px 15px; display: grid; grid-template-columns: 74px 1fr; gap: 14px;
  cursor: pointer; box-shadow: var(--shadow);
}
.row:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }

.rid {
  font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent);
  letter-spacing: .01em; padding-top: 1px;
}
.rbody { min-width: 0; }
.rtitle { font-size: 14.5px; font-weight: 500; line-height: 1.4; }
.rtitle .nm { font-family: var(--mono); font-size: 13.5px; }
.rgloss { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.rmeta { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

.pill {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .04em;
  text-transform: uppercase; padding: 2.5px 7px; border-radius: 5px;
  background: var(--line-soft); color: var(--ink-3); white-space: nowrap;
}
.pill.acc  { background: var(--accent-b); color: var(--accent); }
.pill.flag { background: var(--flag-b);   color: var(--flag); }
.pill.warn { background: var(--warn-b);   color: var(--warn); }
.pill.ok   { background: var(--ok-b);     color: var(--ok); }

/* A magnitude, not decoration: how many ways in. */
.bar { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bar i { display: block; height: 5px; border-radius: 3px; background: var(--accent); opacity: .55; min-width: 3px; }
.bar.hot i { background: var(--warn); opacity: .8; }
.bar.zero i { background: var(--ink-3); opacity: .35; }

.detail { grid-column: 1 / -1; margin-top: 11px; padding-top: 12px; border-top: 1px solid var(--line-soft); display: none; }
.row.open .detail { display: block; }
.dfield { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 5px 0; align-items: start; }
.dfield > dt { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); padding-top: 3px; }
.dfield > dd { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.dfield > dd strong { color: var(--ink); font-weight: 600; }
.isnot { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.isnot li { position: relative; padding-left: 15px; font-size: 13.5px; color: var(--ink-2); }
.isnot li::before { content: "✕"; position: absolute; left: 0; top: 0; color: var(--warn); font-size: 10px; line-height: 1.7; }
.cite { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.empty { padding: 56px 20px; text-align: center; color: var(--ink-3); }
.empty p { font-family: var(--mono); font-size: 13px; }

/* ------------------------------------------------------------------ groups */
.grouphead {
  display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px;
  padding-bottom: 7px; border-bottom: 1px solid var(--line);
}
.grouphead:first-child { margin-top: 4px; }
.grouphead h2 { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.grouphead .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }

/* -------------------------------------------------------------- tally strip */
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 8px; margin: 0 0 22px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tcard b { display: block; font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tcard span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.tcard.acc b { color: var(--accent); } .tcard.flag b { color: var(--flag); }
.tcard.ok b { color: var(--ok); } .tcard.warn b { color: var(--warn); }

.note { background: var(--raised); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 15px; margin: 0 0 22px; font-size: 13.5px; color: var(--ink-2); max-width: 78ch; }
.note strong { color: var(--ink); }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
  background: var(--ink); color: var(--ground); padding: 9px 16px; border-radius: 8px;
  font-family: var(--mono); font-size: 12.5px; opacity: 0; pointer-events: none;
  transition: opacity .16s ease, transform .16s ease; z-index: 40;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }


/* ---------------------------------------------------------------- panels */
.panel { display: grid; gap: 18px; max-width: 900px; }
.panel h3 { font-size: 13px; letter-spacing: .02em; color: var(--ink); margin-bottom: 2px; }
.panel p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 68ch; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 15px 17px; box-shadow: var(--shadow); }
.block > h3 { margin-bottom: 9px; }
pre.tree, pre.tpl {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.55; margin: 0;
  overflow-x: auto; color: var(--ink-2); background: var(--raised);
  border: 1px solid var(--line-soft); border-radius: 8px; padding: 13px 15px;
}
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th {
  text-align: left; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--ink-3); font-weight: 500;
  padding: 0 10px 7px 0; border-bottom: 1px solid var(--line);
}
table.grid td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid td.k { font-family: var(--mono); font-size: 12px; color: var(--accent); white-space: nowrap; }
.scroll { overflow-x: auto; }

/* ladder rows: the tier is the structure, the marker is the state */
.tier { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.tier:last-child { border-bottom: 0; }
.tier .t { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.tier .x { color: var(--ink-2); }
.t0 { background: var(--raised); border: 1px solid var(--line-soft); border-radius: 8px; padding: 11px 13px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
.t0 b { color: var(--accent); font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; display: block; margin-bottom: 3px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; gap: 7px; }
  .dfield { grid-template-columns: 1fr; gap: 3px; }
  .tabs { top: 96px; }
}
</style>
<script>window.__DATA__=/*__DATA__*/null/*__DATA__*/;</script>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <b>BudgetSplit System Map</b>
      <span>docs/SYSTEM.md · 2026-09-01</span>
    </div>
    <div class="find">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="search" placeholder="E-04 · settlement · FL-06.E7 · balance" aria-label="Filter by id or text" autocomplete="off" spellcheck="false">
    </div>
    <span class="hint" id="count"></span>
    <button class="tbtn" id="theme" type="button" aria-label="Switch theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" id="tabs" role="tablist"></div>
</nav>

<main>
  <div id="lede"></div>
  <div id="view" class="rows"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const D = window.__DATA__;

/* Twelve tabs for thirteen sections: §0 and §1 share the Overview panel. A section
   is either a list of citable rows or a prose panel; nothing else. */

const VERDICT = {
  'COLLAPSE':             { cls: 'acc',  label: 'collapse' },
  'COLLAPSE-AFTER-PILOT': { cls: 'flag', label: 'after pilot' },
  'RENAME-ONLY':          { cls: 'ok',   label: 'rename only' },
  'KEEP-DOCUMENTED':      { cls: 'ok',   label: 'keep, documented' },
  'NEEDS-DECISION':       { cls: 'warn', label: 'needs decision' },
};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* Markdown leaks through from the source doc; render the marks that carry meaning. */
const md = s => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/~~([^~]+)~~/g, '<s>$1</s>')
  .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');

const bar = (n, max, hot) => {
  if (n == null) return '';
  const w = Math.max(3, Math.round((n / max) * 68));
  return `<span class="bar ${n === 0 ? 'zero' : (hot ? 'hot' : '')}"><i style="width:${w}px"></i>${n}</span>`;
};
const field = (k, v) => v ? `<div class="dfield"><dt>${esc(k)}</dt><dd>${md(v)}</dd></div>` : '';
/* `· a · b · c` renders as a list, not a paragraph, wherever the doc uses bullets. */
const fieldList = (k, v) => {
  if (!v) return '';
  const parts = v.split('·').map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return field(k, v);
  return `<div class="dfield"><dt>${esc(k)}</dt><dd><ul class="isnot">${
    parts.map(x => `<li>${md(x)}</li>`).join('')}</ul></dd></div>`;
};
const grid = (head, body) => `<div class="scroll"><table class="grid"><thead><tr>${
  head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;

/* A ladder marker is state, so it renders as state. */
function marker(s) {
  const cls = s.startsWith('✅') ? 'ok' : s.startsWith('🔍') ? 'acc' : s.startsWith('❌') ? 'warn' : '';
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

const maxFlow = Math.max(...D.flows.map(f => f.entries || 0));
const maxScr = Math.max(...D.screens.map(s => s.entries || 0));

/* ------------------------------------------------------------------ panels */
function overviewPanel() {
  return `<div class="panel">
    <div class="block">
      <h3>How to cite something</h3>
      <p>Every entry has an id. Cite it and say what is wrong; the prose can change under it.</p>
      <pre class="tpl">${esc(D.issueTpl)}</pre>
      <h3 style="margin-top:14px">Addressing a part of a flow</h3>
      <pre class="tpl">${esc(D.subIds)}</pre>
    </div>
    <div class="block">
      <h3>The nine namespaces</h3>
      ${grid(['id', 'is', 'example', 'answers'], D.legend.map(l =>
        `<tr><td class="k">${esc(l.p)}-</td><td>${md(l.is)}</td><td>${md(l.eg)}</td><td>${md(l.answers)}</td></tr>`).join(''))}
    </div>
    <div class="block">
      <h3>Which section answers which question</h3>
      ${grid(['question', 'section'], D.router.map(r =>
        `<tr><td>${md(r.q)}</td><td class="k">${esc(r.s)}</td></tr>`).join(''))}
    </div>
    <div class="block">
      <h3>Three money worlds</h3>
      ${grid(['world', 'answers', 'root entities'], D.worlds.map(w =>
        `<tr><td class="k">${esc(w.w)}</td><td>${md(w.q)}</td><td>${md(w.e)}</td></tr>`).join(''))}
    </div>
    <div class="block">
      <h3>What it deliberately is not</h3>
      <ul class="isnot">${D.notList.map(n =>
        `<li><strong>${md(n.what)}</strong> ${md(n.why)}</li>`).join('')}</ul>
    </div>
    <div class="block">
      <h3>Everything that leaves the device</h3>
      <p>Nothing else. No analytics SDK, no crash reporter, no ad network.</p>
      ${grid(['destination', 'what', 'when', 'gate'], D.egress.map(e =>
        `<tr><td class="k">${md(e.to)}</td><td>${md(e.what)}</td><td>${md(e.when)}</td><td>${md(e.gate)}</td></tr>`).join(''))}
    </div>
  </div>`;
}

function relationsPanel() {
  return `<div class="panel">
    <div class="block">
      <h3>Ownership</h3>
      <p>Two roots. Everything else hangs off one of them, or off nothing.</p>
      <pre class="tree">${esc(D.tree)}</pre>
    </div>
    <div class="block">
      <h3>Cascade and lifetime — what a delete actually does</h3>
      <p>Written from the code that deletes, not the schema: <code>PRAGMA foreign_keys</code> is
         <strong>off</strong>, so no <code>REFERENCES</code> clause does anything at runtime. Every
         rule below is a hand-written statement somebody has to remember.</p>
      ${grid(['delete', 'what happens to children', 'where'], D.cascade.map(c =>
        `<tr><td class="k">${esc(c.id)} ${esc(c.verb)}</td><td>${md(c.effect)}</td><td class="k">${md(c.where)}</td></tr>`).join(''))}
    </div>
    <div class="block">
      <h3>Cardinality</h3>
      ${grid(['from', '', 'to', 'note'], D.cardinality.map(c =>
        `<tr><td class="k">${esc(c.from)} ${esc(c.fromName)}</td><td>${md(c.card)}</td><td class="k">${esc(c.to)} ${esc(c.toName)}</td><td>${md(c.note)}</td></tr>`).join(''))}
      <p style="margin-top:11px"><strong>E-50 has no row here.</strong> Balances are derived on
         every read. The only stored fact about a debt is the deliberate write-off.</p>
    </div>
  </div>`;
}

function scenarioPanel(q) {
  const hit = l => !q || (l.id + ' ' + l.name + ' ' + l.rows.map(r => r.text).join(' ') + ' ' + (l.raw || '')).toLowerCase().includes(q);
  const ladders = D.ladders.filter(hit);
  const cross = D.crossings.filter(c => !q || (c.id + ' ' + c.name + ' ' + c.bites).toLowerCase().includes(q));
  return `<div class="panel">
    ${ladders.map(l => `<div class="block">
      <h3>${esc(l.id)} · ${esc(l.name)}</h3>
      ${l.t0 ? `<div class="t0"><b>T0 — NOMINAL</b>${md(l.t0)}</div>` : ''}
      ${l.rows.map(r => `<div class="tier"><span class="t">.${esc(r.t)}</span><span class="x">${md(r.text)}</span>${marker(r.status)}</div>`).join('')}
      ${l.raw ? `<pre class="tree">${esc(l.raw)}</pre>` : ''}
    </div>`).join('')}
    ${D.laddersCompact.filter(l => !q || (l.id + l.text).toLowerCase().includes(q)).map(l => `<div class="block">
      <h3>${esc(l.id)}</h3><pre class="tree">${esc(l.text)}</pre></div>`).join('')}
    ${cross.length ? `<div class="block">
      <h3>The remaining ladders — the crossings that bite</h3>
      ${grid(['ladder', 'flow', 'where it misbehaves'], cross.map(c =>
        `<tr><td class="k">${esc(c.id)}${c.also ? '/' + esc(c.also) : ''}</td><td>${md(c.name)}</td><td>${md(c.bites)}</td></tr>`).join(''))}
    </div>` : ''}
  </div>`;
}

function idmapPanel() {
  return `<div class="panel">
    <div class="block">
      <h3>What replaced what</h3>
      ${grid(['was', 'now'], D.supersede.map(s =>
        `<tr><td class="k">${md(s.was)}</td><td>${md(s.now)}</td></tr>`).join(''))}
    </div>
    <div class="block">
      <h3>The guards</h3>
      <p>Eight tests bind this document to the code. What none of them do is check that the prose is
         <em>true</em> — they check that it is consistent with the code's shape.</p>
      ${grid(['test', 'holds'], D.guards.map(g =>
        `<tr><td class="k">${esc(g.file)}</td><td>${md(g.holds)}</td></tr>`).join(''))}
    </div>
    <div class="block">
      <h3>Screen and flow ids are unchanged</h3>
      <p><code>S-19</code> is <code>SC-19</code>; <code>FLOW-04</code> is <code>FL-04</code>. Old
         citations resolve. <code>SC-42</code>, <code>SC-43</code> and <code>SC-44</code> are new —
         <code>/assets</code>, <code>/settings/sync</code> and <code>/settings/sync-log</code> had
         no id and no behaviour section anywhere before this document.</p>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ sections */
const SECTIONS = [
  { key: 'about', label: 'Overview', panel: overviewPanel },

  { key: 'ov', label: 'Complexity', n: D.ovs.length,
    lede: `<p class="lede"><strong>The section that answers "we have made too many complicated flows."</strong> Every finding carries a verdict. Twelve of the 27 close as <em>rename only</em> or <em>keep, documented</em> — at zero code risk. That is the useful result: the app is less over-built than it feels and more under-named.</p>`,
    tally: [['acc', 4, 'collapse now'], ['flag', 5, 'after the pilot'], ['ok', 12, 'vocabulary only'], ['warn', 6, 'need a decision']],
    groupBy: o => VERDICT[o.verdict] ? VERDICT[o.verdict].label : 'unclassified',
    order: ['collapse', 'after pilot', 'rename only', 'keep, documented', 'needs decision'],
    row: o => ({
      id: o.id, title: md(o.title),
      pills: [VERDICT[o.verdict] ? { cls: VERDICT[o.verdict].cls, t: VERDICT[o.verdict].label } : null,
              o.kind ? { cls: '', t: o.kind.replace(/-/g, ' ') } : null],
      detail: fieldList('The things', o.detail) + field('Evidence', o.evidence) + field('Cost today', o.cost)
            + field('Proposal', o.collapse) + field('Blast radius', o.blast) + field('Risk', o.risk)
            + field('Verdict', o.verdictNote) + field('Trigger', o.trigger) + field('Note', o.note),
      text: [o.title, o.kind, o.verdict, o.detail, o.evidence, o.cost, o.collapse].join(' '),
    }) },

  { key: 'ent', label: 'Entities', n: D.entities.length,
    lede: `<p class="lede"><strong>53 nouns, and what each one is not.</strong> The <em>is not</em> field is where a concept gets fenced off from the others wearing its name — and where the hardest questions in this app came from. A field left empty is information: an entity that references nothing is a leaf, one whose sync line is blank cannot travel.</p>`,
    tally: [['acc', 22, 'in SQLite'], ['flag', 18, 'derived, no table'], ['ok', 13, 'device or wire']],
    groupBy: e => ({ table: 'Stored in SQLite', derived: 'Derived — no table', external: 'Device, external or wire' })[e.kind],
    order: ['Stored in SQLite', 'Derived — no table', 'Device, external or wire'],
    row: e => ({
      id: e.id, title: `<span class="nm">${esc(e.name)}</span>`, gloss: e.gloss,
      pills: [e.kind === 'derived' ? { cls: 'flag', t: 'derived' } : null,
              e.kind === 'external' ? { cls: '', t: 'off-database' } : null,
              e.aliasWord ? { cls: 'warn', t: e.aliasWord + ' names' } : null],
      detail: (e.isNot.length ? `<div class="dfield"><dt>Is not</dt><dd><ul class="isnot">${
                 e.isNot.map(x => `<li>${md(x)}</li>`).join('')}</ul></dd></div>` : '')
            + field('Storage', e.storage) + field('Identity', e.identity) + field('Owned by', e.owned)
            + field('Scopes', e.scopes) + fieldList('References', e.refs) + fieldList('Referenced by', e.refBy)
            + field('Lifecycle', e.lifecycle) + field('Create', e.create) + field('Edit', e.edit)
            + field('Delete', e.del) + field('Sync', e.sync) + field('Note', e.reading)
            + field('Also called', e.aliases) + fieldList('Surfaces', e.surfaces)
            + fieldList('Invariants', e.invariants) + field('Open', e.open),
      text: [e.name, e.gloss, e.isNot.join(' '), e.aliases, e.storage, e.sync, e.lifecycle].join(' '),
    }) },

  { key: 'rel', label: 'Relations', panel: relationsPanel },

  { key: 'fl', label: 'Flows', n: D.flows.length,
    lede: `<p class="lede"><strong>54 verbs, each with the number of ways in.</strong> The count is a metric to watch fall. <code>FL-04</code> — add an expense — has 24 entry points and 11 parameters, and is the destination of every settle-up, every "log it", the daily-log notification and the Siri shortcut. A ceiling now holds it at 24. Steps are capped at nine: a flow needing a tenth is two flows.</p>`,
    tally: [['warn', 24, 'ways into Add'], ['acc', 9, 'step cap per flow'], ['flag', 11, 'params on one screen']],
    row: f => ({
      id: f.id, title: esc(f.name),
      pills: [f.params ? { cls: 'warn', t: f.params + ' params' } : null,
              f.terse ? null : { cls: '', t: 'full entry' }],
      right: bar(f.entries, maxFlow, f.entries >= 8),
      detail: field('Trigger', f.trigger) + fieldList('Entry points', f.entry) + field('Preconditions', f.pre)
            + fieldList('Steps', f.steps) + field('Entities', f.ents) + field('Writes', f.writes)
            + field('Exit and back-stack', f.exit) + fieldList('Branches', f.branches)
            + fieldList('Failure modes', f.failures) + field('Reversible', f.reversible)
            + field('Known problems', f.problems) + field('Summary', f.summary),
      text: [f.name, f.trigger, f.steps, f.branches, f.failures, f.problems, f.summary].join(' '),
    }) },

  { key: 'sn', label: 'Scenarios', panel: scenarioPanel,
    lede: `<p class="lede"><strong>Every case for a flow, nominal to pathological.</strong> Rows are <em>generated</em>, not brainstormed: cross the flow with the axes and they fall out. That is what makes coverage checkable. Most are <code>❓</code> — the honest state of a suite with 2,221 passing tests and zero component-render coverage.</p>` },

  { key: 'dq', label: 'Decisions', n: D.dqs.length,
    lede: `<p class="lede"><strong>30 questions, 29 still open.</strong> Each names <em>the default if nobody ever decides</em> — because most of these will not be decided, and the default is what ships. A closed one is struck through and kept, never deleted, or every citation of it rots.</p>`,
    tally: [['acc', 8, 'product'], ['flag', 15, 'technical'], ['warn', 7, 'blocked elsewhere']],
    groupBy: d => ({ product: 'Product and business', technical: 'Technical', blocked: 'Blocked outside this repo' })[d.group],
    order: ['Product and business', 'Technical', 'Blocked outside this repo'],
    row: d => ({
      id: d.id, title: md(d.q),
      pills: [d.closed ? { cls: 'ok', t: 'closed' } : null],
      detail: field(d.group === 'blocked' ? 'Owner' : 'Default if never decided', d.fallback)
            + field(d.group === 'blocked' ? 'Consequence today' : 'Trigger', d.trigger),
      text: [d.q, d.fallback, d.trigger].join(' '),
    }) },

  { key: 'sc', label: 'Screens', n: D.screens.length,
    lede: `<p class="lede"><strong>44 routes, and how many ways there are into each.</strong> Two have none, correctly — they are deep-link landing pads. One has a single unlabeled icon, which is why nobody finds it.</p>`,
    row: s => ({
      id: s.id, title: `<span class="nm">${esc(s.route)}</span>`, gloss: s.purpose,
      right: bar(s.entries, maxScr, s.entries >= 8),
      detail: field('Entry points', s.entries === 0 ? 'None in the app. Reached only by deep link.'
              : s.entries === 1 ? 'One. If it is unlabeled, this screen is effectively hidden.'
              : `${s.entries} in the app.`) + field('Note', s.note),
      text: [s.route, s.purpose, s.note].join(' '),
    }) },

  { key: 'ax', label: 'Axes', n: D.axes.length,
    lede: `<p class="lede"><strong>Eleven questions you can ask of anything.</strong> These generate the scenario ladders rather than decorating them: cross a flow with an axis and the rows write themselves, so a ladder missing a crossing is a <em>visible</em> gap.</p>`,
    row: a => ({
      id: a.id, title: esc(a.name), gloss: a.values,
      detail: field('Why it changes behaviour', a.why),
      text: [a.name, a.values, a.why].join(' '),
    }) },

  { key: 'iv', label: 'Invariants', n: D.ivs.length,
    lede: `<p class="lede"><strong>22 rules that must never be false.</strong> Read the <em>held by</em> column: nine are enforced by a test that reads the real source. The rest are enforced by people remembering, which is worth knowing before relying on one.</p>`,
    row: v => {
      const mech = !/unenforced/i.test(v.heldBy);
      return { id: v.id, title: md(v.rule),
        pills: [{ cls: mech ? 'ok' : 'warn', t: mech ? 'test-enforced' : 'by hand' }],
        detail: field('Held by', v.heldBy) + fieldList('Constrains', v.on),
        text: [v.rule, v.heldBy, v.on].join(' ') };
    } },

  { key: 'fe', label: 'Features', n: D.feats.length,
    lede: `<p class="lede"><strong>70 capabilities and their real state.</strong> Flags are user preferences, never entitlements — there is no paywall anywhere in the app, and repurposing one as a gate is forbidden. Several features are complete, tested, and have never run on a phone.</p>`,
    row: f => {
      const s = f.state;
      const cls = /never|unproven|dead|broken|partly/i.test(s) ? 'warn'
                : /parked|blocked|dropped/i.test(s) ? 'flag'
                : /flag:/i.test(s) ? 'acc' : 'ok';
      return { id: f.id, title: esc(f.name),
        pills: [{ cls, t: s.replace(/`|\*\*/g, '').split(',')[0].slice(0, 26) }],
        detail: field('State', s) + fieldList('Where', f.where) + fieldList('Entities', f.ents),
        text: [f.name, s, f.where].join(' ') };
    } },

  { key: 'map', label: 'ID map', panel: idmapPanel },
];

/* --------------------------------------------------------------- rendering */
let active = 'ov';
const tabs = document.getElementById('tabs');
const view = document.getElementById('view');
const lede = document.getElementById('lede');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');

tabs.innerHTML = SECTIONS.map(s =>
  `<button class="tab" role="tab" data-k="${s.key}" aria-selected="${s.key === active}">${esc(s.label)}${
    s.n ? `<span class="n">${s.n}</span>` : ''}</button>`).join('');

const DATA = { ov: D.ovs, ent: D.entities, fl: D.flows, dq: D.dqs, sc: D.screens, iv: D.ivs, fe: D.feats, ax: D.axes };

function render() {
  const sec = SECTIONS.find(s => s.key === active);
  const q = qEl.value.trim().toLowerCase();
  /* A sub-id like FL-06.E7 should still find its flow. */
  const base = q.replace(/^([a-z]{1,2}-\d+)\..*$/i, '$1');

  if (sec.panel) {
    lede.innerHTML = q ? '' : (sec.lede || '');
    view.innerHTML = sec.panel(q);
    countEl.textContent = q ? 'filtered' : '';
    return;
  }

  const src = DATA[sec.key];
  const items = src.map(sec.row).filter(r => {
    if (!q) return true;
    const hay = (r.id + ' ' + (r.text || '')).toLowerCase();
    return hay.includes(q) || hay.includes(base);
  });
  countEl.textContent = q ? `${items.length} of ${sec.n}` : `${sec.n} entries`;

  let head = q ? '' : (sec.lede || '');
  if (!q && sec.tally) {
    head += `<div class="tally">${sec.tally.map(([c, n, l]) =>
      `<div class="tcard ${c}"><b>${n}</b><span>${esc(l)}</span></div>`).join('')}</div>`;
  }
  lede.innerHTML = head;

  if (!items.length) {
    view.innerHTML = `<div class="empty"><p>Nothing matches &ldquo;${esc(qEl.value)}&rdquo;.</p></div>`;
    return;
  }

  const card = r => `
    <article class="row" tabindex="0" data-id="${r.id}">
      <div class="rid">${esc(r.id)}</div>
      <div class="rbody">
        <div class="rtitle">${r.title}</div>
        ${r.gloss ? `<div class="rgloss">${md(r.gloss)}</div>` : ''}
        <div class="rmeta">
          ${(r.pills || []).filter(Boolean).map(p => `<span class="pill ${p.cls}">${esc(p.t)}</span>`).join('')}
          ${r.right || ''}
        </div>
      </div>
      <div class="detail">
        ${r.detail || ''}
        <div class="cite">
          <button class="tbtn" data-cite="${r.id}" type="button">Copy issue template</button>
          <span class="hint">cite <code>${esc(r.id)}</code> when you file it</span>
        </div>
      </div>
    </article>`;

  if (sec.groupBy && !q) {
    const buckets = new Map();
    items.forEach((r, i) => {
      const g = sec.groupBy(src[i]);
      if (!buckets.has(g)) buckets.set(g, []);
      buckets.get(g).push(r);
    });
    const order = sec.order || [...buckets.keys()];
    view.innerHTML = order.filter(g => buckets.has(g)).map(g => `
      <div class="grouphead"><h2>${esc(g)}</h2><span class="sub">${buckets.get(g).length}</span></div>
      ${buckets.get(g).map(card).join('')}`).join('');
  } else {
    view.innerHTML = items.map(card).join('');
  }
}

/* ------------------------------------------------------------- interaction */
tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  active = b.dataset.k;
  [...tabs.children].forEach(t => t.setAttribute('aria-selected', String(t.dataset.k === active)));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

qEl.addEventListener('input', render);

view.addEventListener('click', e => {
  const cite = e.target.closest('[data-cite]');
  if (cite) {
    e.stopPropagation();
    const id = cite.dataset.cite;
    const row = cite.closest('.row');
    const what = row.querySelector('.rtitle').innerText.trim();
    navigator.clipboard.writeText(
      `Where:    ${id}  (${what})\nWhat:     \nExpected: \nRelated:  \n\n— docs/SYSTEM.md`
    ).then(() => flash(`${id} template copied`), () => flash('Copy blocked by the browser'));
    return;
  }
  const row = e.target.closest('.row');
  if (row) row.classList.toggle('open');
});
view.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('.row');
  if (row && !e.target.closest('[data-cite]')) { e.preventDefault(); row.classList.toggle('open'); }
});

const toast = document.getElementById('toast');
let tid;
function flash(msg) {
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(tid);
  tid = setTimeout(() => toast.classList.remove('on'), 1900);
}

/* Theme: follow the OS until asked otherwise, then remember the choice. */
const root = document.documentElement;
try {
  const saved = localStorage.getItem('bsm-theme');
  if (saved) root.setAttribute('data-theme', saved);
} catch (_) { /* private window, or site data blocked — the OS theme still applies */ }
document.getElementById('theme').addEventListener('click', () => {
  const dark = root.getAttribute('data-theme') === 'dark'
    || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('bsm-theme', next); } catch (_) {}
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
  if (e.key === 'Escape' && document.activeElement === qEl) { qEl.value = ''; render(); qEl.blur(); }
});

render();
</script>
