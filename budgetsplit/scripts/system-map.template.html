      const hard = items.filter(v => !/unenforced/i.test(v.heldBy));
      const soft = items.filter(v => /unenforced/i.test(v.heldBy));
      return `<section class="hero"><h1>Rules that must never be false</h1>
          <p>Nine are enforced by a test that reads the real source. The rest are enforced by people
             remembering — worth knowing before you rely on one.</p></section>
        ${group('A test enforces these', hard.length, hard.map(ivItem).join(''), true)}
        ${group('Nothing enforces these', soft.length, soft.map(ivItem).join(''), !!q)}`;
    },
  },
  scenarios: {
    label: 'Scenarios', n: D.ladders.length + D.laddersCompact.length,
    view: q => {
      const mk = s => {
        const c = s.startsWith('✅') ? 'ok' : s.startsWith('🔍') ? 'acc' : s.startsWith('❌') ? 'warn' : '';
        const t = s.startsWith('✅') ? 'tested' : s.startsWith('🔍') ? 'checked by hand'
                : s.startsWith('❌') ? 'known broken' : 'nobody has checked';
        return `<span class="tag ${c}">${esc(t)}</span>`;
      };
      const lad = D.ladders.filter(l => match(l, q));
      return `<section class="hero"><h1>What happens when it goes wrong</h1>
          <p>Each case is <em>generated</em> — cross a task with the things that vary and the rows
             fall out, so a gap is visible rather than merely absent. Ordinary first, then two
             people, then bad input, then the cases the database allows and the screens forbid.</p>
          </section>
        ${lad.map(l => group(l.name, l.rows.length || 1,
          (l.t0 ? `<div class="body"><div class="kv"><dt>Normal</dt><dd>${md(l.t0)}</dd></div></div>` : '')
          + (l.rows.length ? `<div class="body">${l.rows.map(r =>
              `<div class="tier"><span class="t">${esc(r.t)}</span><span class="x">${md(r.text)}</span>
               <span class="m">${mk(r.status)}</span></div>`).join('')}</div>`
            : `<div class="body"><pre class="pre">${esc(l.raw || '')}</pre></div>`), false)).join('')}
        ${group('Every other task, and where it misbehaves', D.crossings.length,
          `<div class="body">${D.crossings.filter(c => match(c, q)).map(c =>
            `<div class="kv"><dt>${esc(c.name)}</dt><dd>${md(c.bites)}</dd></div>`).join('')}</div>`, !!q)}`;
    },
  },
  reference: {
    label: 'Reference', n: 0,
    view: q => `<section class="hero"><h1>Reference</h1>
        <p>How to cite something, what the app is, what leaves the device, and what happens to the
           data when you delete things.</p></section>
      ${group('How to file an issue', 1, `<div class="body">
        <p style="color:var(--ink-2);font-size:14px;margin-bottom:10px">Open any entry, press
        <strong>Copy issue template</strong>, and fill it in. The id is the shared name — the wording
        under it can change without breaking your reference.</p>
        <pre class="pre">${esc(D.issueTpl)}</pre>
        <p style="color:var(--ink-2);font-size:14px;margin:12px 0 8px">You can point at part of a task, too:</p>
        <pre class="pre">${esc(plain(D.subIds))}</pre></div>`, true)}
      ${group('What the app is for', D.worlds.length, `<div class="body">${
        D.worlds.map(w => `<div class="kv"><dt>${esc(w.w)}</dt><dd>${md(w.q)}</dd></div>`).join('')}</div>`, false)}
      ${group('What it deliberately is not', D.notList.length, `<div class="body">${
        D.notList.map(n => `<div class="kv"><dt>${esc(n.what.replace(/^Not /, 'Not '))}</dt><dd>${md(n.why)}</dd></div>`).join('')}</div>`, false)}
      ${group('Everything that leaves the device', D.egress.length, `<div class="body">
        <p style="color:var(--ink-2);font-size:14px;margin-bottom:8px">Nothing else. No analytics, no
        crash reporter, no ad network.</p>${
        D.egress.map(e => `<div class="kv"><dt>${md(e.to)}</dt><dd>${md(e.what)} — ${md(e.when)}</dd></div>`).join('')}</div>`, false)}
      ${group('What a delete actually destroys', D.cascade.length, `<div class="body">
        <p style="color:var(--ink-2);font-size:14px;margin-bottom:8px">Written from the code that
        deletes, not the schema: foreign keys are <strong>off</strong>, so every rule here is a
        hand-written statement somebody has to remember.</p>${
        D.cascade.map(c => `<div class="kv"><dt>${esc(D.names[c.id] || c.id)} ${esc(c.verb)}</dt><dd>${md(c.effect)}</dd></div>`).join('')}</div>`, false)}
      ${group('How things are connected', 1, `<div class="body"><pre class="pre">${esc(D.tree)}</pre></div>`, false)}
      ${group('Things that vary', D.axes.length, D.axes.map(axItem).join(''), false,
        'The dimensions every task is tested across.')}
      ${group('What replaced what', D.supersede.length, `<div class="body">${
        D.supersede.map(s => `<div class="kv"><dt>${md(s.was)}</dt><dd>${md(s.now)}</dd></div>`).join('')}</div>`, false)}
      ${group('What keeps this page honest', D.guards.length, `<div class="body">
        <p style="color:var(--ink-2);font-size:14px;margin-bottom:8px">Eight tests bind this to the
        code. None can tell whether the words are <em>true</em> — only that they match the code's shape.</p>${
        D.guards.map(g => `<div class="kv"><dt><code>${esc(g.file)}</code></dt><dd>${md(g.holds)}</dd></div>`).join('')}</div>`, false)}`,
  },
};

/* ------------------------------------------------------------------- shell */
let active = 'shelf';
const main = document.getElementById('main');
const qEl = document.getElementById('q');

const MODES = [
  ['shelf', 'Walk the app'], ['notebook', 'My notebook'],
  ['markdown', 'Markdown'], ['lookup', 'Look something up'],
];
document.getElementById('navMode').innerHTML = MODES.map(([k, label]) =>
  `<button class="chip" type="button" data-mode="${k}" aria-pressed="${k === active}">${esc(label)}</button>`).join('');
function render() {
  const q = qEl.value.trim().toLowerCase();
  const inLookup = !!(D.AREAS.find(a => a.key === active) || CROSS[active]);
  document.querySelectorAll('.chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.mode === active
      || (c.dataset.mode === 'lookup' && inLookup))));

  if (active === 'shelf' && !q) { main.innerHTML = bk.book ? bookletView() : shelfView(); return; }
  if (active === 'notebook' && !q) { main.innerHTML = notebookView(); return; }
  if (active === 'markdown' && !q) { main.innerHTML = markdownView(); return; }
  if (active === 'lookup' && !q) { main.innerHTML = lookupView(); return; }

  if (q) {
    /* A search is a question about the whole app, not the tab you happen to be on. */
    const parts = D.AREAS.map(a => areaView(a, q)).filter(Boolean);
    main.innerHTML = parts.length ? parts.join('') : `<p class="empty">Nothing matches “${esc(qEl.value)}”.</p>`;
    return;
  }
  const area = D.AREAS.find(a => a.key === active);
  main.innerHTML = area ? areaView(area, '') : (CROSS[active] ? CROSS[active].view('') : shelfView());
}

document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  active = b.dataset.mode;
  if (active === 'shelf') bk.book = null;
  jumping = false; composing = false; confirming = false;
  if (qEl.value) qEl.value = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
qEl.addEventListener('input', render);

main.addEventListener('input', e => {
  const inote = e.target.closest('[data-inote]');
  if (inote) {
    const id = inote.dataset.inote;
    bk.ans[id] = { ...ansFor(id), note: inote.value };
    save();
    return;
  }
  const bn = e.target.closest('[data-note-for]');
  if (bn) {
    const id = bn.dataset.noteFor;
    bk.ans[id] = { ...ansFor(id), note: bn.value };
    save();
    return;
  }
  const ta = e.target.closest('[data-note]');
  if (!ta || !bk.book) return;
  const id = stopId(BOOK[bk.book].stops[bk.pos]);
  bk.ans[id] = { ...ansFor(id), note: ta.value };
  save();   /* no re-render — that would take the cursor out mid-sentence */
});

main.addEventListener('click', e => {
  const hit = (sel) => e.target.closest(sel);

  const opt = hit('[data-q]');
  if (opt && bk.book) {
    /* Answering is the most frequent thing you do here, and rebuilding the whole
       page for it is what made this feel slow. Move the pressed state by hand and
       leave the rest of the DOM alone. */
    const id = stopId(BOOK[bk.book].stops[bk.pos]);
    const cur = ansFor(id);
    const k = opt.dataset.q;
    const clearing = cur[k] === opt.dataset.v;
    bk.ans[id] = { ...cur, [k]: clearing ? '' : opt.dataset.v };
    save();
    const row = opt.closest('.opts');
    if (row) for (const b of row.querySelectorAll('.opt')) {
      b.setAttribute('aria-pressed', String(!clearing && b === opt));
    }
    return;
  }

  const ib = hit('[data-iq]');
  if (ib) {
    const id = ib.dataset.iq;
    const cur = ansFor(id);
    const clearing = cur.look === ib.dataset.v;
    bk.ans[id] = { ...cur, look: clearing ? '' : ib.dataset.v };
    save();
    const row = ib.closest('.irow');
    for (const b of row.querySelectorAll('.ib')) {
      b.setAttribute('aria-pressed', String(!clearing && b === ib));
    }
    /* The note field only exists once something is crossed. */
    const wants = !clearing && ib.dataset.v === 'broken';
    const note = row.querySelector('.inote');
    if (wants && !note) {
      const el = document.createElement('input');
      el.className = 'inote'; el.type = 'text';
      el.setAttribute('data-inote', id);
      el.placeholder = 'what is wrong with it?';
      row.appendChild(el); el.focus();
    } else if (!wants && note && !note.value) {
      note.remove();
    }
    return;
  }

  if (hit('[data-show-how]')) { showHow = true; render(); return; }
  if (hit('[data-hide-how]')) { showHow = false; render(); return; }

  const addNote = hit('[data-inote-add]');
  if (addNote) {
    /* A tick with a caveat had nowhere to go. Detail is available whatever you
       answered, and on every row, not only the crossed ones. */
    const row = addNote.closest('.irow');
    let note = row.querySelector('.inote');
    if (!note) {
      note = document.createElement('input');
      note.className = 'inote'; note.type = 'text';
      note.setAttribute('data-inote', addNote.dataset.inoteAdd);
      note.placeholder = 'anything worth saying about it?';
      row.appendChild(note);
    }
    note.focus();
    return;
  }

  const jt = hit('[data-jump-toggle]');
  if (jt) { jumping = !jumping; render(); return; }

  const jr = hit('[data-jump]');
  if (jr) {
    bk.pos = Number(jr.dataset.jump); jumping = false; save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (hit('[data-find-cancel]')) { composing = false; render(); return; }
  if (hit('[data-find-save]')) {
    const ta = main.querySelector('[data-find-text]');
    const text = ta && ta.value.trim();
    if (text) {
      bk.finds.push({
        text,
        where: bk.book ? stopTitle(BOOK[bk.book].stops[bk.pos]) : '',
        at: Date.now(),
      });
      flash('Saved to your notebook');
    }
    composing = false; save(); render();
    return;
  }
  const open = hit('[data-open-book]');
  if (open) {
    jumping = false; composing = false;
    bk.book = open.dataset.openBook; bk.pos = 0; active = 'shelf';
    save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const mode = hit('[data-mode]');
  if (mode) {
    jumping = false; composing = false; confirming = false;
    if (mode.dataset.mode === 'shelf') bk.book = null;
    active = mode.dataset.mode; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const go = hit('[data-go]');
  if (go) {
    jumping = false; composing = false;
    bk.pos += Number(go.dataset.go); save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const goto = hit('[data-goto]');
  if (goto) {
    const [key, pos] = goto.dataset.goto.split('|');
    bk.book = key; bk.pos = Number(pos); active = 'shelf';
    save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (hit('[data-add-find]')) {
    composing = true; render();
    const ta = main.querySelector('[data-find-text]');
    if (ta) ta.focus();
    return;
  }
  const drop = hit('[data-drop-find]');
  if (drop) { bk.finds.splice(Number(drop.dataset.dropFind), 1); save(); render(); return; }

  const sc = hit('[data-md-scope]');
  if (sc) {
    mdScope = sc.dataset.mdScope; render();
    const ta = main.querySelector('[data-md]');
    if (ta) ta.scrollTop = 0;
    return;
  }
  if (hit('[data-copy-md]')) {
    const text = fullMarkdown(mdScope);
    navigator.clipboard.writeText(text).then(
      () => flash(`Copied ${(text.length / 1024).toFixed(0)} KB — paste it into the chat`),
      () => {
        /* Clipboard refused. Select it instead, so one keystroke still gets it out. */
        const ta = main.querySelector('[data-md]');
        if (ta) { ta.focus(); ta.select(); }
        flash('Copy blocked — it is selected, press ⌘C');
      });
    return;
  }
  if (hit('[data-copy]')) {
    navigator.clipboard.writeText(exportMarkdown())
      .then(() => flash('Copied — paste it into the chat to save it'),
            () => flash('Copy blocked — press "Show the markdown" and select it'));
    return;
  }
  if (hit('[data-restore-open]')) {
    restoring = true; restoreFound = null; restoreArmed = false; render();
    const ta = main.querySelector('[data-restore-in]');
    if (ta) ta.focus();
    return;
  }
  if (hit('[data-restore-cancel]')) {
    restoring = false; restoreFound = null; restoreArmed = false; render();
    return;
  }
  if (hit('[data-restore-check]')) {
    const ta = main.querySelector('[data-restore-in]');
    const parsed = readState(ta ? ta.value : '');
    restoreFound = parsed || false;
    restoreArmed = false;
    render();
    return;
  }
  if (hit('[data-restore-apply]')) {
    if (!restoreFound) return;
    if (!restoreArmed) { restoreArmed = true; render(); setTimeout(() => { restoreArmed = false; render(); }, 4000); return; }
    bk = { book: null, pos: 0, ans: restoreFound.ans, finds: restoreFound.finds };
    save();
    restoring = false; restoreFound = null; restoreArmed = false;
    active = 'shelf';
    render();
    flash('Restored — picking up from where that file left off');
    return;
  }
  if (hit('[data-reset]')) {
    /* Two taps rather than a confirm box, which this sandbox will not show. */
    if (!confirming) { confirming = true; render(); setTimeout(() => { confirming = false; render(); }, 4000); return; }
    confirming = false;
    bk = { book: null, pos: 0, ans: {}, finds: [] }; save(); render();
    flash('Cleared');
    return;
  }

  const b = e.target.closest('[data-cite]');
  if (!b) return;
  const id = b.dataset.cite;
  const what = b.closest('.item').querySelector('.h').innerText.trim();
  navigator.clipboard.writeText(
    `Where:    ${id}  (${what})\nWhat:     \nExpected: \nRelated:  \n\n— docs/SYSTEM.md`
  ).then(() => flash(`${id} copied — paste it into the issue`), () => flash('Copy blocked by the browser'));
});

const toast = document.getElementById('toast');
let tid;
function flash(msg) {
  toast.textContent = msg; toast.classList.add('on');
  clearTimeout(tid); tid = setTimeout(() => toast.classList.remove('on'), 2000);
}

const root = document.documentElement;
try { const s = localStorage.getItem('bsm-theme'); if (s) root.setAttribute('data-theme', s); }
catch (_) { /* private window — the OS theme still applies */ }
document.getElementById('theme').addEventListener('click', () => {
  const dark = root.getAttribute('data-theme') === 'dark'
    || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('bsm-theme', next); } catch (_) {}
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
  if (e.key === 'Escape' && document.activeElement === qEl) { qEl.value = ''; render(); qEl.blur(); }
});

render();
</script>
