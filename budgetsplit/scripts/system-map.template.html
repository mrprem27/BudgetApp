<title>BudgetSplit System Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Palette from the app's own tokens (AGENTS.md §10): this describes BudgetSplit,
   so it should look like BudgetSplit. Neutrals lean teal in both themes. */
:root {
  --ground:#EEF4F2; --surface:#FFFFFF; --raised:#F5FAF9;
  --line:#D6E3DF; --hair:#E7EFED;
  --ink:#0B1614; --ink-2:#40564F; --ink-3:#6C8380;
  --accent:#0E8C82; --accent-b:#D9F0ED;
  --flag:#6250C9; --flag-b:#E7E4F8;
  --warn:#BC4130; --warn-b:#FAE4E0;
  --ok:#0F7A55; --ok-b:#DBF1E7;
  --shadow:0 1px 2px rgba(11,22,20,.05), 0 10px 26px -18px rgba(11,22,20,.3);
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad:20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#0A0F11; --surface:#13201F; --raised:#182C2A;
    --line:#22322F; --hair:#1B2A28;
    --ink:#ECF3F1; --ink-2:#A5B9B5; --ink-3:#7E9390;
    --accent:#20C4B8; --accent-b:#0F3230;
    --flag:#A296FB; --flag-b:#231F3C;
    --warn:#FF8878; --warn-b:#37211E;
    --ok:#2BD49B; --ok-b:#0F3125;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --ground:#0A0F11; --surface:#13201F; --raised:#182C2A;
  --line:#22322F; --hair:#1B2A28;
  --ink:#ECF3F1; --ink-2:#A5B9B5; --ink-3:#7E9390;
  --accent:#20C4B8; --accent-b:#0F3230;
  --flag:#A296FB; --flag-b:#231F3C;
  --warn:#FF8878; --warn-b:#37211E;
  --ok:#2BD49B; --ok-b:#0F3125;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -18px rgba(0,0,0,.8);
}

* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-.012em; text-wrap:balance; }
p { margin:0; }
code { font-family:var(--mono); font-size:.88em; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

/* ------------------------------------------------------------------ chrome */
.top { position:sticky; top:0; z-index:30; background:var(--ground); border-bottom:1px solid var(--line); }
.top-in { max-width:900px; margin:0 auto; padding:12px var(--pad); display:flex; gap:12px; align-items:center; }
.brand { font-size:15px; font-weight:600; margin-right:auto; white-space:nowrap; letter-spacing:-.015em; }
.brand small { display:block; font-family:var(--mono); font-size:10.5px; font-weight:400; color:var(--ink-3); letter-spacing:0; }
.find { position:relative; flex:1 1 auto; min-width:0; max-width:340px; }
.find input {
  width:100%; padding:10px 12px 10px 34px; border-radius:9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:var(--sans); font-size:16px; /* 16px keeps iOS from zooming on focus */
}
.find input::placeholder { color:var(--ink-3); }
.find svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); }
.iconbtn {
  flex:none; width:40px; height:40px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:9px; cursor:pointer;
}
.iconbtn:hover { color:var(--ink); border-color:var(--accent); }

/* ------------------------------------------------------------------- nav */
nav { position:sticky; top:65px; z-index:29; background:var(--ground); border-bottom:1px solid var(--line); }
.nav-in { max-width:900px; margin:0 auto; padding:9px var(--pad) 11px; }
.navrow { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.navrow::-webkit-scrollbar { display:none; }
.navrow + .navrow { margin-top:7px; }
.navlabel { font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin:0 0 5px 2px; }
.chip {
  flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:20px; padding:7px 13px; font:inherit; font-size:13.5px; cursor:pointer;
  white-space:nowrap; min-height:36px; display:inline-flex; align-items:center; gap:6px;
}
.chip:hover { color:var(--ink); border-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--ground); font-weight:500; }
.chip b { font-family:var(--mono); font-size:11px; font-weight:400; opacity:.7; }

/* ------------------------------------------------------------------ page */
main { max-width:900px; margin:0 auto; padding:22px var(--pad) 90px; }
.hero h1 { font-size:23px; line-height:1.25; }
.hero p { color:var(--ink-2); font-size:15.5px; margin-top:8px; max-width:62ch; }
.stat { display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; }
.stat div { font-size:13px; color:var(--ink-3); }
.stat b { font-family:var(--mono); font-size:17px; color:var(--ink); font-weight:500; display:block; }

/* a collapsible group — native <details>, so it works with no JS and with a keyboard */
details.grp { margin-top:16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
details.grp > summary {
  list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px;
  font-weight:600; font-size:14.5px; min-height:52px;
}
details.grp > summary::-webkit-details-marker { display:none; }
details.grp > summary .cnt { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-3); font-weight:400; }
details.grp > summary .caret { color:var(--ink-3); transition:transform .15s ease; flex:none; }
details.grp[open] > summary .caret { transform:rotate(90deg); }
details.grp > summary:hover { background:var(--raised); }
.grp-note { padding:0 16px 12px; margin-top:-4px; color:var(--ink-2); font-size:14px; max-width:62ch; }

/* an item: id, headline, state, and an optional body */
.item { border-top:1px solid var(--hair); }
.item > summary {
  list-style:none; cursor:pointer; padding:13px 16px; display:grid;
  grid-template-columns:1fr auto; gap:4px 12px; align-items:start; min-height:52px;
}
.item > summary::-webkit-details-marker { display:none; }
.item > summary:hover { background:var(--raised); }
.item .h { font-size:15px; font-weight:500; line-height:1.45; }
.item .h .mono { font-family:var(--mono); font-size:14px; }
.item .sub { grid-column:1/-1; color:var(--ink-2); font-size:14px; line-height:1.5; }
.item .tags { grid-column:1/-1; display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:3px; }
.idtag { font-family:var(--mono); font-size:11px; color:var(--ink-3); white-space:nowrap; padding-top:3px; }

.tag {
  font-size:11.5px; letter-spacing:.01em; padding:2px 8px; border-radius:20px;
  background:var(--hair); color:var(--ink-3); white-space:nowrap;
}
.tag.acc { background:var(--accent-b); color:var(--accent); }
.tag.flag { background:var(--flag-b); color:var(--flag); }
.tag.warn { background:var(--warn-b); color:var(--warn); }
.tag.ok { background:var(--ok-b); color:var(--ok); }

.body { padding:2px 16px 16px; }
.kv { display:grid; grid-template-columns:120px 1fr; gap:4px 14px; padding:7px 0; border-top:1px solid var(--hair); }
.kv:first-child { border-top:0; }
.kv dt { font-size:12px; color:var(--ink-3); }
.kv dd { margin:0; font-size:14px; color:var(--ink-2); line-height:1.55; }
.kv ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
.kv ul li { padding-left:15px; position:relative; }
.kv ul li::before { content:"–"; position:absolute; left:0; color:var(--ink-3); }
.kv.no ul li::before { content:"✕"; color:var(--warn); font-size:11px; }
.kv ul.steps li { padding-left:0; display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline; }
.kv ul.steps li::before { content:none; }
.sub-id { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
.ref { font-family:var(--mono); font-size:.82em; color:var(--ink-3); }
.cite { margin-top:12px; }
.cite button {
  border:1px solid var(--line); background:var(--raised); color:var(--ink-2);
  border-radius:8px; padding:9px 14px; font:inherit; font-size:13.5px; cursor:pointer; min-height:40px;
}
.cite button:hover { border-color:var(--accent); color:var(--ink); }

pre.pre {
  font-family:var(--mono); font-size:11.5px; line-height:1.55; margin:0;
  overflow-x:auto; color:var(--ink-2); background:var(--raised);
  border:1px solid var(--hair); border-radius:9px; padding:12px 14px;
}
.tier { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; padding:9px 0; border-top:1px solid var(--hair); font-size:14px; }
.tier .t { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); padding-top:2px; }
.tier .x { color:var(--ink-2); line-height:1.5; }
.tier .m { grid-column:2; }
.empty { padding:50px 0; text-align:center; color:var(--ink-3); font-size:15px; }

.toast {
  position:fixed; left:50%; bottom:22px; transform:translate(-50%,12px);
  background:var(--ink); color:var(--ground); padding:11px 18px; border-radius:9px;
  font-size:14px; opacity:0; pointer-events:none; transition:opacity .16s, transform .16s; z-index:50;
}
.toast.on { opacity:1; transform:translate(-50%,0); }

/* ------------------------------------------------------------- responsive */
@media (min-width:760px) {
  body { font-size:15px; }
  :root { --pad:24px; }
  .find input { font-size:14px; padding:9px 12px 9px 33px; }
  .hero h1 { font-size:27px; }
}
@media (max-width:759px) {
  nav { top:61px; }
  .brand small { display:none; }
  .kv { grid-template-columns:1fr; gap:2px; }
  .kv dt { font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
}

/* ---------------------------------------------------- walk & booklet UI */
.wrap { max-width:720px; margin:0 auto; }
.prog { position:sticky; top:0; z-index:25; background:var(--ground); padding:10px 0 12px; }
.prog .bar { height:6px; border-radius:4px; background:var(--hair); overflow:hidden; }
.prog .bar i { display:block; height:100%; background:hsl(var(--h, 174) var(--hs) var(--hl)); transition:width .25s ease; }
.prog .meta { display:flex; gap:10px; align-items:baseline; margin-top:8px; font-size:12.5px; color:var(--ink-3); flex-wrap:wrap; }
.prog .meta b { font-family:var(--mono); color:var(--ink); font-weight:500; }
.prog .meta .sp { margin-left:auto; }

.stop { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; margin-top:14px; }
.stop header { padding:16px 18px 14px; border-bottom:1px solid var(--hair); }
.stop .eyebrow { font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); }
.stop h2 { font-size:20px; line-height:1.25; margin-top:6px; }
.stop .why { color:var(--ink-2); font-size:15px; margin-top:7px; }
.stop .where { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.route { font-family:var(--mono); font-size:12px; background:var(--accent-b); color:var(--accent); padding:4px 9px; border-radius:7px; }

.blk { padding:15px 18px; border-bottom:1px solid var(--hair); }
.blk:last-of-type { border-bottom:0; }
.blk h3 { font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:500; margin-bottom:9px; }
.blk ol, .blk ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
.blk li { font-size:15px; line-height:1.5; color:var(--ink); display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:baseline; }
.blk li .n { font-family:var(--mono); font-size:11px; color:var(--ink-3); min-width:20px; }
.blk.warn li .n { color:var(--warn); }
.blk p { font-size:15px; color:var(--ink-2); line-height:1.55; }
.blk.expect { background:var(--ok-b); }
.blk.expect h3 { color:var(--ok); }
.blk.expect p, .blk.expect li { color:var(--ink); }
.blk.hard { background:var(--raised); }

/* answer */
.ans { padding:15px 18px; background:var(--raised); border-top:1px solid var(--line); }
.ans h3 { font-size:14px; font-weight:600; margin-bottom:10px; }
.opts { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.opt {
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:10px; padding:11px 4px; font:inherit; font-size:13px; cursor:pointer;
  min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
}
.opt span { font-size:16px; line-height:1; }
.opt:hover { border-color:var(--accent); color:var(--ink); }
.opt[aria-pressed="true"] { color:var(--ground); font-weight:500; }
.opt.ok[aria-pressed="true"]   { background:var(--ok);   border-color:var(--ok); }
.opt.bad[aria-pressed="true"]  { background:var(--warn); border-color:var(--warn); }
.opt.odd[aria-pressed="true"]  { background:var(--flag); border-color:var(--flag); }
.opt.skip[aria-pressed="true"] { background:var(--ink-3); border-color:var(--ink-3); }
.ans textarea {
  width:100%; margin-top:11px; min-height:88px; resize:vertical; padding:12px;
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  color:var(--ink); font:inherit; font-size:16px; line-height:1.5;
}
.ans textarea::placeholder { color:var(--ink-3); }

.pager { display:flex; gap:10px; margin:16px 0 0; }
.pager button {
  flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:11px; padding:14px; font:inherit; font-size:15px; font-weight:500;
  cursor:pointer; min-height:52px;
}
.pager button.primary { background:var(--accent); border-color:var(--accent); color:var(--ground); }
.pager button:disabled { opacity:.4; cursor:default; }

.jump { margin-top:14px; }
.jump select {
  width:100%; padding:12px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface); color:var(--ink); font:inherit; font-size:16px;
}

/* notebook */
.nb { margin-top:14px; }
.nbrow { background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 15px; margin-bottom:8px; box-shadow:var(--shadow); }
.nbrow .top { display:flex; gap:9px; align-items:baseline; }
.nbrow .top b { font-size:14.5px; font-weight:500; }
.nbrow .top .id { font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-left:auto; }
.nbrow .note { margin-top:7px; font-size:14px; color:var(--ink-2); white-space:pre-wrap; line-height:1.5; }
.nbrow.j { cursor:pointer; }
.nbrow.j:hover { border-color:var(--accent); }
.act { display:flex; gap:9px; flex-wrap:wrap; margin:14px 0 20px; }
.act button {
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:12px 16px; font:inherit; font-size:14.5px; cursor:pointer; min-height:48px;
}
.act button.primary { background:var(--accent); border-color:var(--accent); color:var(--ground); font-weight:500; }
.act button.danger:hover { border-color:var(--warn); color:var(--warn); }

@media (max-width:420px) { .opts { grid-template-columns:repeat(2,1fr); } }


/* ------------------------------------------------------- grouped, and coloured
   A hue per area, from one custom property so both themes stay legible: the same
   hue, lighter and less saturated on a dark ground. */
:root { --hl:38%; --hs:52%; --hb:94%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hl:66%; --hs:46%; --hb:15%; } }
:root[data-theme="dark"] { --hl:66%; --hs:46%; --hb:15%; }

.group { margin-top:22px; }
.ghead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:0 0 8px; border-bottom:2px solid hsl(var(--h) var(--hs) var(--hl) / .35); }
.ghead h2 { font-size:14px; color:hsl(var(--h) var(--hs) var(--hl)); }
.gmeta { font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-left:auto;
  font-variant-numeric:tabular-nums; }

/* --------------------------------------------------------------- the shelf */
.shelf { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-top:18px; }
.bcard {
  text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-left:3px solid hsl(var(--h) var(--hs) var(--hl));
  border-radius:12px; padding:14px 15px; cursor:pointer; font:inherit; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:9px; min-height:96px;
}
.bcard:hover { border-color:hsl(var(--h) var(--hs) var(--hl)); border-left-color:hsl(var(--h) var(--hs) var(--hl)); }
.bcard.full { background:hsl(var(--h) var(--hs) var(--hb)); }
.btop { display:flex; gap:8px; align-items:flex-start; }
.bname { font-size:14.5px; font-weight:500; line-height:1.35; flex:1; }
.bbar { height:5px; border-radius:3px; background:var(--hair); overflow:hidden; }
.bbar i { display:block; height:100%; background:hsl(var(--h) var(--hs) var(--hl)); }
.bcard.full .bbar i { background:var(--ok); }
.bmeta { font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.bmeta b { color:var(--warn); font-weight:500; }

.crumb {
  border:0; background:none; color:var(--ink-3); font:inherit; font-size:13px;
  cursor:pointer; padding:4px 0 8px; display:block;
}
.crumb:hover { color:var(--accent); }
.intro { background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-top:12px; }
.intro p { font-size:14.5px; color:var(--ink-2); line-height:1.55; }
.intro p + p { margin-top:9px; }
.intro .how { font-size:13.5px; }
.intro .how.warn { color:var(--warn); }

/* ------------------------------------------------------------- the questions */
.qrow + .qrow { margin-top:14px; padding-top:14px; border-top:1px solid var(--hair); }
.qrow h3 { font-size:14.5px; font-weight:600; margin-bottom:9px; }
.qhint { display:block; font-size:13px; font-weight:400; color:var(--ink-2); margin-top:4px; line-height:1.5; }
.opts-3 { grid-template-columns:repeat(3,1fr); }
.opt.fine[aria-pressed="true"], .opt.holds[aria-pressed="true"], .opt.yes[aria-pressed="true"] { background:var(--ok); border-color:var(--ok); color:var(--ground); }
.opt.off[aria-pressed="true"] { background:var(--flag); border-color:var(--flag); color:var(--ground); }
.opt.broken[aria-pressed="true"], .opt.wrong[aria-pressed="true"], .opt.no[aria-pressed="true"] { background:var(--warn); border-color:var(--warn); color:var(--ground); }
.opt.skip[aria-pressed="true"] { background:var(--ink-3); border-color:var(--ink-3); color:var(--ground); }

.nbh { font-size:13px; margin:16px 0 8px; }
.xbtn { border:0; background:none; color:var(--ink-3); font-size:15px; cursor:pointer; padding:0 2px; margin-left:auto; }
.xbtn:hover { color:var(--warn); }

.route-out { margin-top:10px; font-size:13.5px; color:var(--ink-2); line-height:1.6; max-width:64ch;
  background:var(--raised); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:9px; padding:11px 13px; }
.route-out strong { color:var(--ink); }
.asknote { font-size:12.5px; color:var(--ink-3); margin:0 0 9px; }
.req, .opt-label {
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em;
  padding:2px 6px; border-radius:4px; margin-right:6px;
}
.req { background:var(--accent-b); color:var(--accent); }
.opt-label { background:var(--hair); color:var(--ink-3); }
.ans .asknote:not(:first-child) { margin-top:14px; padding-top:14px; border-top:1px solid var(--hair); }
.mdbox { margin-top:14px; }

.restorebox { margin-top:20px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:15px 16px; box-shadow:var(--shadow); }
.restorebox h3 { font-size:14.5px; margin-bottom:8px; }
.restorebox p { font-size:13.5px; color:var(--ink-2); line-height:1.55; }
.restorebox p + p { margin-top:8px; }
.restorebox textarea[data-restore-in] {
  width:100%; min-height:140px; margin-top:11px; resize:vertical; padding:12px;
  border:1px solid var(--line); border-radius:10px; background:var(--raised);
  color:var(--ink); font-family:var(--mono); font-size:12px; line-height:1.5;
}

<script>
const D = window.__DATA__;

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* Two different jobs, and conflating them is what made the first cut unreadable.
 *
 * A LIST of ids ("E-06 · E-07 · E-08") is pure address and reads far better as
 * names. Substitute there.
 *
 * PROSE is not. "who paid and who owes are E-06 and E-07" becomes "who paid and
 * who owes are who paid and who owes" the moment you substitute blindly — the
 * sentence already said the thing the id points at. So in prose the ids stay, but
 * they stop shouting: trailing pointer tails ("IV-04, OV-03.") are dropped
 * outright, and what remains is set quietly. */
const ID = /\b(?:E|SC|FL|AX|FE|SN|IV|OV|DQ)-\d+[a-z]?(?:\.[A-Za-z0-9]+)?\b/g;

const humanList = s => String(s || '')
  .split('·').map(x => x.trim()).filter(Boolean)
  .map(x => x.replace(ID, m => D.names[m] || m))
  .join(' · ');

/* A short glossary. The document is written for whoever edits the code and uses
   its vocabulary; this page is read by whoever decides what is wrong with the app.
   Only words with an exact plain equivalent are swapped — anything ambiguous stays,
   because a wrong word is worse than a technical one. */
const PLAIN = [
  [/\bpredicates?\b/g, m => m.endsWith('s') ? 'conditions' : 'condition'],
  [/\blaunch invariant\b/g, 'startup check'],
  [/\bentity types?\b/g, 'kinds of thing'],
  [/\bflows\b/g, 'tasks'], [/\bflow\b/g, 'task'],
  [/\bscenario ladder\b/g, 'list of cases'],
  [/\bLadder SN-\d+\.?/g, ''],
];
const plain = s => PLAIN.reduce((a, [re, to]) => a.replace(re, to), String(s || ''));

const mark = s => s
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/~~([^~]+)~~/g, '<s>$1</s>')
  .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');

const md = s => mark(esc(plain(s)
    /* A trailing sentence that is NOTHING but cross-references is noise; the ids
       live on the rows themselves. The lookbehind is load-bearing — without it
       this also eats the "E-07" out of "who paid and who owes are E-06 and E-07",
       which is a reference doing real grammatical work. */
    .replace(/(?<=\.)\s*(?:[A-Z]{1,4}-\d+[a-z]?[,\s]*)+\.\s*$/g, '')
    /* A parenthetical id is pure aside — the sentence always reads without it. */
    .replace(/\s*\((?:[A-Z]{1,4}-\d+[a-z]?[,;\s]*)+\)/g, '')
    /* "SN-06.T4a" is a scenario nobody can look up in their head. */
    .replace(/\bSN-(\d+)\.(T\d[a-z]?)\b/g,
      (m, n, tier) => (D.names['SN-' + n] ? `${D.names['SN-' + n]}, case ${tier}` : m))
    .replace(/\s{2,}/g, ' ')
    .trim()))
  .replace(ID, m => `<span class="ref">${m}</span>`);

/* Sub-ids are how you cite one step or one failure, so keep them — but as a quiet
   marker beside the line, not inline in the sentence. */
const splitSub = v => String(v || '')
  .split(/\s+(?=\.(?:S|FM|B|E|T)\d)/)
  .map(x => x.trim()).filter(Boolean)
  .map(x => {
    const m = x.match(/^\.((?:S|FM|B|E|T)\d+[a-z]?)\s+([\s\S]*)$/);
    return m ? { sub: m[1], text: m[2] } : { sub: '', text: x };
  });

const VERDICT = {
  'COLLAPSE':             ['acc',  'fix it'],
  'COLLAPSE-AFTER-PILOT': ['flag', 'after the pilot'],
  'RENAME-ONLY':          ['ok',   'just a rename'],
  'KEEP-DOCUMENTED':      ['ok',   'fine as it is'],
  'NEEDS-DECISION':       ['warn', 'needs a decision'],
};
function featTag(state) {
  const s = state || '';
  if (/never run|unproven/i.test(s)) return ['warn', 'never tested on a phone'];
  if (/dead|broken/i.test(s)) return ['warn', 'not working'];
  if (/partly/i.test(s)) return ['warn', 'partly working'];
  if (/parked|dropped|does not exist/i.test(s)) return ['flag', 'not built'];
  if (/blocked/i.test(s)) return ['flag', 'blocked'];
  if (/server-gated/i.test(s)) return ['flag', 'needs an account'];
  const f = s.match(/flag:`?(\w+)`?/);
  if (f) return ['acc', /off/i.test(s) ? 'switchable, off' : 'switchable'];
  return ['ok', 'on'];
}

const kv = (k, v) => v ? `<div class="kv"><dt>${esc(k)}</dt><dd>${chain(v)}</dd></div>` : '';
const kvList = (k, v, cls) => {
  const parts = humanList(v).split('·').map(x => x.trim()).filter(Boolean);
  if (!parts.length) return '';
  if (parts.length === 1) return kv(k, parts[0]);
  return `<div class="kv ${cls || ''}"><dt>${esc(k)}</dt><dd><ul>${
    parts.map(x => `<li>${chain(x)}</li>`).join('')}</ul></dd></div>`;
};
/* Steps, branches and failure modes: one line each, sub-id kept for citing. */
const kvSteps = (k, v, cls) => {
  const parts = splitSub(v);
  if (!parts.length) return '';
  if (parts.length === 1 && !parts[0].sub) return kv(k, v);
  return `<div class="kv ${cls || ''}"><dt>${esc(k)}</dt><dd><ul class="steps">${
    parts.map(p => `<li>${p.sub ? `<span class="sub-id">${esc(p.sub)}</span>` : ''}${chain(p.text)}</li>`)
      .join('')}</ul></dd></div>`;
};
const kvArr = (k, arr, cls) => !arr || !arr.length ? '' :
  `<div class="kv ${cls || ''}"><dt>${esc(k)}</dt><dd><ul>${
    arr.map(x => `<li>${md(x)}</li>`).join('')}</ul></dd></div>`;

/* One item shape everywhere: headline, optional sub, tags, an expandable body. */
function item({ id, h, sub, tags, body }) {
  return `<details class="item"><summary>
      <span class="h">${h}</span>
      <span class="idtag">${esc(id)}</span>
      ${sub ? `<span class="sub">${sub}</span>` : ''}
      ${tags && tags.length ? `<span class="tags">${tags.filter(Boolean).map(([c, t]) =>
        `<span class="tag ${c}">${esc(t)}</span>`).join('')}</span>` : ''}
    </summary>
    <div class="body">${body || ''}
      <div class="cite"><button type="button" data-cite="${esc(id)}">Copy issue template</button></div>
    </div></details>`;
}
const group = (title, count, inner, open, note) => !inner ? '' : `
  <details class="grp"${open ? ' open' : ''}><summary>
    <svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    ${esc(title)}<span class="cnt">${count}</span></summary>
    ${note ? `<p class="grp-note">${note}</p>` : ''}${inner}</details>`;

/* ------------------------------------------------------------- item bodies */
const byId = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
const ENT = byId(D.entities), FL = byId(D.flows), SC = byId(D.screens),
      FE = byId(D.feats), OV = byId(D.ovs), DQ = byId(D.dqs);

const entItem = e => item({
  id: e.id, h: esc(e.friendly), sub: `<span class="mono">${esc(e.name)}</span>${e.gloss ? ' — ' + md(e.gloss) : ''}`,
  tags: [e.aliasWord ? ['warn', `also called ${e.aliasWord} other things`] : null,
         e.kind === 'derived' ? ['flag', 'not stored — recomputed'] : null,
         e.kind === 'external' ? ['flag', 'outside the database'] : null],
  body: kvArr('What it is not', e.isNot, 'no') + kv('Stored', e.storage) + kv('Identified by', e.identity)
      + kv('Belongs to', e.owned) + kv('Scopes', e.scopes) + kvList('Points at', e.refs)
      + kvList('Pointed at by', e.refBy) + kv('Life', e.lifecycle) + kv('Created by', e.create)
      + kv('Edited by', e.edit) + kv('Deleted by', e.del) + kv('Syncs', e.sync)
      + kv('Note', e.reading) + kv('Other names', e.aliases) + kvList('Seen on', e.surfaces)
      + kvList('Rules', e.invariants) + kvList('Problems', e.open),
});
const flItem = f => item({
  id: f.id, h: esc(f.name), sub: f.trigger ? md(f.trigger) : (f.summary ? md(f.summary.slice(0, 160)) : ''),
  tags: [f.entries != null ? ['', `${f.entries} way${f.entries === 1 ? '' : 's'} in`] : null,
         f.params ? ['warn', `${f.params} parameters`] : null],
  body: kvSteps('Where you start', f.entry) + kv('Needs first', f.pre) + kvSteps('Steps', f.steps)
      + kv('Touches', f.ents) + kv('Writes', f.writes) + kv('Ends up', f.exit)
      + kvSteps('Other paths', f.branches) + kvSteps('What goes wrong', f.failures, 'no')
      + kv('Undo', f.reversible) + kvList('Known problems', f.problems) + kv('In short', f.summary),
});
const scItem = s => item({
  id: s.id, h: `<span class="mono">${esc(s.route)}</span>`, sub: s.purpose ? md(s.purpose) : '',
  tags: [s.entries === 0 ? ['flag', 'deep link only'] : s.entries === 1 ? ['warn', 'one way in']
        : s.entries != null ? ['', `${s.entries} ways in`] : null],
  body: kv('Note', s.note),
});
const feItem = f => { const [c, t] = featTag(f.state); return item({
  id: f.id, h: esc(f.name), tags: [[c, t]],
  body: kv('State', f.state) + kvList('Where', f.where) + kvList('Uses', f.ents) }); };
const ovItem = o => { const v = VERDICT[o.verdict] || ['', o.verdict || '—']; return item({
  id: o.id, h: md(o.title), tags: [v, o.kind ? ['', o.kind.replace(/-/g, ' ')] : null],
  body: kvList('The things', o.detail) + kv('How we know', o.evidence) + kv('What it costs today', o.cost)
      + kv('What to do', o.collapse) + kv('How big', o.blast) + kv('Risk', o.risk)
      + kv('Verdict', o.verdictNote) + kv('When it becomes urgent', o.trigger) + kv('Note', o.note) }); };
const dqItem = d => item({
  id: d.id, h: md(d.q), tags: [d.closed ? ['ok', 'settled'] : null],
  body: kv(d.group === 'blocked' ? 'Waiting on' : 'What happens if nobody decides', d.fallback)
      + kv(d.group === 'blocked' ? 'Effect today' : 'What forces the decision', d.trigger),
});
const ivItem = v => { const mech = !/unenforced/i.test(v.heldBy); return item({
  id: v.id, h: md(v.rule), tags: [mech ? ['ok', 'a test enforces this'] : ['warn', 'nothing enforces this']],
  body: kv('Held by', v.heldBy) + kvList('Applies to', v.on) }); };
const axItem = a => item({
  id: a.id, h: esc(a.name), sub: esc(a.values), body: kv('Why it matters', a.why) });

/* ---------------------------------------------------------------- the views */
function areaView(a, q) {
  const pick = (ids, map) => ids.map(i => map[i]).filter(Boolean).filter(x => match(x, q));
  const fe = pick(a.fe, FE), fl = pick(a.fl, FL), sc = pick(a.sc, SC),
        ent = pick(a.ent, ENT), ov = pick(a.ov, OV), dq = pick(a.dq, DQ);
  const total = fe.length + fl.length + sc.length + ent.length + ov.length + dq.length;
  if (q && !total) return '';
  return `<section class="hero">
      <h1>${esc(a.name)}</h1>
      <p>${esc(a.blurb)}</p>
    </section>
    ${group('What it does', fe.length, fe.map(feItem).join(''), !q,
        'Every capability in this area, and whether it actually works today.')}
    ${group('How you do it', fl.length, fl.map(flItem).join(''), false,
        'Each task end to end — where you start, the steps, and what goes wrong.')}
    ${group('Screens', sc.length, sc.map(scItem).join(''), false)}
    ${group('The things involved', ent.length, ent.map(entItem).join(''), false,
        'The nouns. Each one says what it is <em>not</em>, which is where the confusion usually is.')}
    ${group("What's confusing here", ov.length, ov.map(ovItem).join(''), !!q,
        'Duplication and overload, each with a verdict.')}
    ${group("What's undecided", dq.length, dq.map(dqItem).join(''), false,
        'Open questions, and what happens if nobody ever answers them.')}`;
}

function match(x, q) {
  if (!q) return true;
  const base = q.replace(/^([a-z]{1,2}-\d+)\..*$/i, '$1');
  const hay = JSON.stringify(x).toLowerCase();
  return hay.includes(q) || hay.includes(base);
}

/* ------------------------------------------------------------ the booklets */

/* Three renderers the stop bodies share. Steps and failure modes come through
   with their sub-ids attached, so they number themselves; everything else is a
   `·`-separated list; and a block is just a titled section that disappears when
   it has nothing to say. */
function stepList(v) {
  const parts = splitSub(v);
  if (!parts.length) return '';
  return `<ol>${parts.map((p, i) =>
    `<li><span class="n">${p.sub ? esc(p.sub.replace(/^[A-Z]+/, '')) : i + 1}</span><span>${chain(p.text)}</span></li>`
  ).join('')}</ol>`;
}

/* A step is usually its own screen — first run alone is nine of them. Marking the
   whole task "broken" then says nothing about which one broke, so every step gets
   its own tick, cross and note, keyed under the task. */
function answerableSteps(sid, v) {
  const parts = splitSub(v);
  if (!parts.length) return '';
  return `<ul class="ilist">${parts.map((p, i) => itemRow(
    sid, p.sub || `S${i + 1}`,
    `<span class="stepn">${esc((p.sub || String(i + 1)).replace(/^[A-Z]+/, ''))}</span> ${chain(p.text)}`
  )).join('')}</ul>`;
}
function dotList(v) {
  const parts = String(v || '').split('·').map(x => x.trim()).filter(Boolean);
  if (!parts.length) return '';
  return `<ul>${parts.map(x => `<li><span class="n">·</span><span>${chain(x)}</span></li>`).join('')}</ul>`;
}
/* Anywhere the document writes `a → b → c` it means a chain, and running it
   together as a sentence hides the shape. Render the arrows.
   `pending → live → soft-deleted` is a lifecycle; `no VPA → the button is absent`
   is a cause and its effect. Both read better as links than as prose. */
function chain(v) {
  const s = String(v || '');
  if (!s.includes('→')) return md(s);
  const links = s.split('→').map(x => x.trim()).filter(Boolean);
  return `<span class="chain">${links.map((x, i) =>
    `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<span class="link">${md(x)}</span>`
  ).join('')}</span>`;
}

const block = (title, inner, cls) =>
  inner ? `<div class="blk ${cls || ''}"><h3>${esc(title)}</h3>${inner}</div>` : '';

const STATE = {
  empty: { label: 'wipe first', how: 'Settings → tap the version 7× → Storage → <b>Erase all data</b>' },
  demo:  { label: 'demo data',  how: 'Settings → tap the version 7× → Storage → <b>Load demo data</b>' },
  hands: { label: 'changes things', how: 'Keep the demo data. These stops change it.' },
  pair:  { label: 'needs 2 phones', how: 'An account, and someone else running the app.' },
};

const FLOW = Object.fromEntries(D.flows.map(f => [f.id, f]));
const SCREEN = Object.fromEntries(D.screens.map(s => [s.id, s]));
const RULE = Object.fromEntries(D.ivs.map(v => [v.id, v]));
const PROB = Object.fromEntries(D.ovs.map(o => [o.id, o]));
const DEC = Object.fromEntries(D.dqs.map(d => [d.id, d]));
const BOOK = Object.fromEntries(D.booklets.map(b => [b.key, b]));

const stopId = s => s.kind === 'empty' ? 'EMPTY' : s.id;

/* -------------------------------------------------------------- your answers */
const KEY = 'bsw-v2';
let bk = { book: null, pos: 0, ans: {}, finds: [] };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) bk = { book: null, pos: 0, ans: {}, finds: [], ...JSON.parse(raw) };
  else {
    /* Carry over the first walkthrough's answers rather than throwing away
       whatever has already been walked. Runs once — after this, v2 exists. */
    const old = localStorage.getItem('bsw-v1');
    if (old) {
      const o = JSON.parse(old);
      for (const [id, v] of Object.entries(o.notes || {})) {
        bk.ans[id] = {
          behave: { ok: 'fine', bad: 'broken', odd: 'off', skip: 'skip' }[v.s] || '',
          note: v.n || '',
        };
      }
    }
  }
} catch (_) { /* private window — it works, it just forgets */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(bk)); } catch (_) {} };
const ansFor = id => bk.ans[id] || {};

/* View state, deliberately not persisted — none of it is a finding.
   `prompt()` and `confirm()` are inert in this viewer's sandbox, so anything
   that needs an answer from you has to be built into the page. */
let composing = false;   // the add-a-finding box is open
let showHow = false;     // set once the data is loaded, below
let jumping = false;     // the stop list is open
let confirming = false;  // "start over" is one tap from happening
let restoring = false;   // the paste-to-restore box is open
let restoreFound = null; // { ans, finds } parsed from the pasted text, or null
let restoreArmed = false; // "Replace everything" is one tap from happening

/* Explain itself once: open until you have answered something, shut after. */
showHow = Object.keys(bk.ans).length === 0 && bk.finds.length === 0;

/** Anything that is not "fine" or unanswered is worth carrying to the notebook. */
const BAD = new Set(['broken', 'wrong', 'off', 'no']);
const stopFlagged = id => Object.entries(ansFor(id)).some(([k, v]) => k !== 'note' && BAD.has(v));
const stopAnswered = id => Object.entries(ansFor(id)).some(([k, v]) => k !== 'note' && v);

/* ------------------------------------------------------------- the questions */
const Q = {
  look:    { q: 'Does it look right?', a: [['fine', 'fine'], ['off', 'a bit off'], ['broken', 'broken']] },
  behave:  { q: 'Did it do what it said?', a: [['fine', 'yes'], ['off', 'sort of'], ['broken', 'no']] },
  numbers: { q: 'Did the numbers come out right?', a: [['fine', 'right'], ['wrong', 'wrong'], ['skip', "didn't check"]] },
  data:    { q: 'Is the data right afterwards?', a: [['fine', 'right'], ['wrong', 'wrong'], ['skip', "didn't check"]] },
  rule:    { q: 'Does this hold in the app?', a: [['fine', 'holds'], ['broken', 'broken'], ['skip', "didn't check"]] },
  still:   { q: 'Is this still true?', a: [['yes', 'still true'], ['no', 'fixed now'], ['skip', 'not sure']] },
};
function questionsFor(stop) {
  if (stop.kind === 'flow') {
    const f = FLOW[stop.id];
    const writes = !/^\s*(nothing|none)\b/i.test((f.writes || '').replace(/[*_`]/g, ''));
    return ['look', 'behave', ...(f.numbers ? ['numbers'] : []), ...(writes ? ['data'] : [])];
  }
  if (stop.kind === 'screen') return ['look'];
  if (stop.kind === 'rule') return ['rule'];
  if (stop.kind === 'problem') return ['still'];
  if (stop.kind === 'decision') return [];
  return ['look'];
}

function askBlock(stop) {
  const id = stopId(stop);
  const a = ansFor(id);
  const qs = questionsFor(stop);
  const numbersHint = stop.kind === 'flow' && FLOW[stop.id].numbers
    ? String(FLOW[stop.id].numbers).split('·').map(x => x.trim()).filter(Boolean)[0] : '';
  return `<div class="ans">
    ${qs.length ? `<p class="asknote"><span class="req">answer these</span> — they are separate
       because they fail separately</p>` : ''}
    ${qs.map(k => `<div class="qrow">
      <h3>${esc(Q[k].q)}${k === 'numbers' && numbersHint
        ? `<span class="qhint">${md(numbersHint)}</span>` : ''}</h3>
      <div class="opts opts-${Q[k].a.length}">${Q[k].a.map(([v, label]) =>
        `<button class="opt ${v}" type="button" data-q="${k}" data-v="${v}"
           aria-pressed="${a[k] === v}">${esc(label)}</button>`).join('')}</div>
    </div>`).join('')}
    <p class="asknote"><span class="opt-label">optional</span> anything else worth writing down</p>
    <textarea data-note placeholder="${stop.kind === 'decision'
      ? 'What do you think? This is the answer — there is no other one.'
      : 'Anything else you noticed'}">${esc(a.note || '')}</textarea>
  </div>`;
}

/* ------------------------------------------------------------- stop bodies */
function flowStop(f) {
  return `${block('You need', f.state ? `<p>${md(f.state)}</p>` : '')}
    ${block('Start from', stepList(f.entry) || (f.entry ? `<p>${md(f.entry)}</p>` : ''))}
    ${block('Do this — tick each one off, cross the one that breaks', answerableSteps('FL:' + f.id, f.steps))}
    ${block('Should happen', [f.writes, f.exit].filter(Boolean).map(x => `<p>${md(x)}</p>`).join(''), 'expect')}
    ${block('Check the numbers', dotList(f.numbers), 'expect')}
    ${block('Watch out for', stepList(f.failures), 'warn')}
    ${block('Also try — optional, and where the interesting failures are', dotList(f.alsoTry), 'hard')}
    ${block('If it went wrong', [f.reversible, f.problems].filter(Boolean).map(x => `<p>${md(x)}</p>`).join(''))}`;
}
function screenStop(s, parts, popups) {
  const ways = s.entries === 0 ? 'Nothing in the app opens this — it arrives from a link.'
    : s.entries === 1 ? 'Exactly one way in. If it is an unlabelled icon, this screen is effectively hidden.'
    : `${s.entries} ways in.`;
  return `${block('Get there', `<p class="reach">${s.reach ? md(s.reach) : `Open <code>${esc(s.route)}</code>`}</p>
      <p class="reachsub">${esc(ways)} <span class="mono">${esc(s.route)}</span></p>`)}
    ${s.purpose ? block('What it is for', `<p>${md(s.purpose)}</p>`) : ''}
    ${parts && parts.length ? block('The pieces on it — mark any that look wrong',
      `<ul class="ilist">${parts.map(p => itemRow('SC:' + s.id, p, `<span class="mono">${esc(p)}</span>`)).join('')}</ul>`) : ''}
    ${popups && popups.length ? block(
      `Popups this screen can raise — ${popups.length} of them. Make one appear if you can`,
      `<ul class="ilist">${popups.map(x => itemRow('AL:' + s.id, x,
        `<span class="popup">“${esc(x)}”</span>`)).join('')}</ul>`) : ''}
    ${block('Look for', `<ul>
      <li><span class="n">·</span><span>the empty state — is it designed, or a blank?</span></li>
      <li><span class="n">·</span><span>anything cut off, overlapping, or too small to tap</span></li>
      <li><span class="n">·</span><span>the back button — does it go where you expect?</span></li>
      <li><span class="n">·</span><span>pull to refresh, if it should have it</span></li></ul>`)}
    ${s.note ? block('Known', `<p>${md(s.note)}</p>`) : ''}`;
}
function ruleStop(v) {
  const mech = !/unenforced/i.test(v.heldBy);
  return `${block('The rule', `<p>${md(v.rule)}</p>`, 'expect')}
    ${block('Who holds it', `<p>${mech
      ? `A test does: <code>${esc(v.heldBy.replace(/[*`]/g, ''))}</code>. Worth checking anyway — a test proves the maths, not the screen.`
      : '<strong>Nothing does.</strong> This one is held by people remembering, which is why it is here.'}</p>`,
      mech ? '' : 'warn')}
    ${block('Applies to', dotList(humanList(v.on)))}`;
}
function problemStop(o) {
  const v = VERDICT[o.verdict] || ['', o.verdict || ''];
  return `${block('The finding', `<p>${md(o.title)}</p>`)}
    ${block('What it costs today', o.cost ? `<p>${md(o.cost)}</p>` : '', 'warn')}
    ${block('The verdict on it', `<p><span class="tag ${v[0]}">${esc(v[1])}</span> ${md(o.verdictNote || '')}</p>`)}
    ${block('What would fix it', o.collapse ? `<p>${md(o.collapse)}</p>` : '')}`;
}
function decisionStop(d) {
  return `${block('The question', `<p>${md(d.q)}</p>`)}
    ${block(d.group === 'blocked' ? 'Waiting on' : 'What happens if nobody decides',
      d.fallback ? `<p>${md(d.fallback)}</p>` : '', 'warn')}
    ${block(d.group === 'blocked' ? 'Effect today' : 'What would force it', d.trigger ? `<p>${md(d.trigger)}</p>` : '')}`;
}
function emptyStop() {
  const list = D.screens.filter(s => s.reach);
  return `${block('With the app wiped, open everything', `<p>Every list is empty right now, and this is
    the only time you will see that. An empty state should have an icon, a line saying what goes
    here, and something to tap — never a blank, and never a zero pretending to be data.</p>`)}
    ${block(`Walk all ${list.length} — tick the ones that look right, cross the ones that do not`,
      `<ul class="ilist">${list.map(s =>
        itemRow('EMPTY', s.id, md(s.reach), `<span class="mono">${esc(s.route)}</span>`)).join('')}</ul>`)}`;
}

function stopBody(stop) {
  if (stop.kind === 'flow') return flowStop(FLOW[stop.id]);
  if (stop.kind === 'screen') return screenStop(SCREEN[stop.id], stop.parts, stop.popups);
  if (stop.kind === 'rule') return ruleStop(RULE[stop.id]);
  if (stop.kind === 'problem') return problemStop(PROB[stop.id]);
  if (stop.kind === 'decision') return decisionStop(DEC[stop.id]);
  return emptyStop();
}
function stopTitle(stop) {
  if (stop.kind === 'flow') return FLOW[stop.id].name;
  if (stop.kind === 'screen') return SCREEN[stop.id].route;
  if (stop.kind === 'rule') return D.names[stop.id] || stop.id;
  if (stop.kind === 'problem') return PROB[stop.id].title;
  if (stop.kind === 'decision') return DEC[stop.id].q;
  return 'Every empty state';
}
const stopWhy = stop => stop.kind === 'flow' ? (FLOW[stop.id].trigger || '') : '';

/* ------------------------------------------------------------------- shelf */
/* An inline composer, because the sandbox will not give us a prompt box. */
/* A stop that lists forty screens cannot be answered with one button. Each row
   gets its own, keyed under the stop so it travels with it into the notebook. */
function itemRow(sid, key, label, sub) {
  const id = `${sid}::${key}`;
  const a = ansFor(id);
  return `<li class="irow">
    <div class="ihead">
      <div class="ilabel">${label}${sub ? `<span class="isub">${sub}</span>` : ''}</div>
      <div class="ibtns">
        <button type="button" class="ib fine" data-iq="${esc(id)}" data-v="fine"
          aria-pressed="${a.look === 'fine'}" aria-label="fine">✓</button>
        <button type="button" class="ib broken" data-iq="${esc(id)}" data-v="broken"
          aria-pressed="${a.look === 'broken'}" aria-label="problem">✕</button>
        <button type="button" class="ib note" data-inote-add="${esc(id)}"
          aria-label="add a note">✎</button>
      </div>
    </div>
    ${a.look === 'broken' || a.note ? `<input class="inote" type="text" data-inote="${esc(id)}"
      value="${esc(a.note || '')}" placeholder="${a.look === 'fine'
        ? 'anything worth saying about it?' : 'what is wrong with it?'}">` : ''}
  </li>`;
}

function findingBox() {
  if (!composing) {
    return `<div class="act"><button type="button" data-add-find>＋ Add a finding of your own</button></div>`;
  }
  return `<div class="composer">
    <h3>Something you noticed that no stop asked about</h3>
    <textarea data-find-text placeholder="e.g. the back button on Reports goes to Home, not back"></textarea>
    <div class="act">
      <button type="button" class="primary" data-find-save>Save it</button>
      <button type="button" data-find-cancel>Cancel</button>
    </div>
  </div>`;
}

function bookProgress(b) {
  const done = b.stops.filter(s => stopAnswered(stopId(s))).length;
  return { done, total: b.stops.length, pct: Math.round((done / b.stops.length) * 100) };
}
const hrs = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60 ? (m % 60) + ' m' : ''}`.trim() : `${m} m`;

function howTo() {
  return `<div class="howto">
    <h3>How this works</h3>
    <p>A <strong>booklet</strong> is one sitting — ${D.time.cap} minutes at most — on one part of the app.
       Take any one from the shelf, or press <em>Start at the top</em> and it carries you through
       all ${D.booklets.length}.</p>
    <p>Each stop tells you <strong>how to get there</strong> (in taps, not paths), what to do, and
       what the numbers should do afterwards. Then it asks you. The questions are separate because
       they fail separately — a screen can look right and compute wrong.</p>
    <p><strong>Before a booklet</strong>, put the app in the state its badge asks for:</p>
    <dl>
      <dt>wipe first</dt><dd>Settings → tap the version 7× → <b>Erase all data</b>. The only way to see an empty state.</dd>
      <dt>demo data</dt><dd>Settings → tap the version 7× → <b>Load demo data</b>. Nothing here changes it.</dd>
      <dt>changes things</dt><dd>Keep the demo data — these stops change it, so go slowly.</dd>
      <dt>needs 2 phones</dt><dd>Park these until there is a second device.</dd>
    </dl>
    <p>Everything saves on this device as you go — close the tab and come back. When you are done,
       open <strong>Markdown</strong> and press copy, then paste it into the chat.</p>
    <p>Switching devices mid-walk? <code>Markdown → Everything</code> ends with a block your
       phone cannot see any other way — paste that whole file into the walkthrough on the other
       device (<strong>Markdown → Continuing on another device?</strong>) and it picks up your
       answers from there.</p>
    <div class="act close"><button type="button" data-hide-how>Got it</button></div>
  </div>`;
}

function shelfView() {
  const totalStops = D.booklets.reduce((n, b) => n + b.stops.length, 0);
  const doneStops = D.booklets.reduce((n, b) => n + bookProgress(b).done, 0);
  const flagged = D.booklets.reduce((n, b) =>
    n + b.stops.filter(s => stopFlagged(stopId(s))).length, 0);
  const left = D.booklets.reduce((n, b) => {
    const p = bookProgress(b);
    return n + Math.round(b.min * (1 - p.done / p.total));
  }, 0);
  return `<div class="wrap">
    ${showHow ? howTo() : ''}
    <section class="hero">
      <h1>Walk the app</h1>
      <p>${D.booklets.length} small booklets, none longer than ${D.time.cap} minutes. Take any one,
         or start at the top and it carries you through. Every screen, every task, every component,
         every rule and every open question is in here exactly once.</p>
      <div class="stat">
        <div><b>${doneStops}</b>of ${totalStops} stops</div>
        <div><b>${flagged}</b>flagged</div>
        <div><b>≈ ${hrs(left)}</b>left, of ≈ ${hrs(D.time.total)}</div>
      </div>
      <p class="route-out"><strong>Roughly ${hrs(D.time.solo)}</strong> you can walk on your own —
         about ${Math.ceil(D.time.solo / 30)} evenings at half an hour. The other
         ${hrs(D.time.pair)} needs a second phone and is parked at the end.
         <br>Every time here is an <strong>estimate</strong>, worked out from how much each stop
         asks of you. Treat them as a way to pick a booklet for the time you have, not a promise.</p>
      <div class="act">
        <button type="button" class="primary" data-open-book="${esc(D.booklets[0].key)}">Start at the top</button>
        ${showHow ? '' : '<button type="button" data-show-how>How this works</button>'}
      </div>
    </section>
    ${(() => {
      /* Grouped, and each area in its own hue — thirty-two cards in one flat grid
         gave you no way to see that six of them were the same subject. */
      const groups = [];
      for (const b of D.booklets) {
        const g = groups.find(x => x.name === b.group);
        (g || groups[groups.push({ name: b.group, hue: b.hue, books: [] }) - 1]).books.push(b);
      }
      return groups.map(g => {
        const done = g.books.reduce((n, b) => n + bookProgress(b).done, 0);
        const all = g.books.reduce((n, b) => n + b.stops.length, 0);
        const mins = g.books.reduce((n, b) => n + b.min, 0);
        return `<section class="group" style="--h:${g.hue}">
          <div class="ghead">
            <h2>${esc(g.name)}</h2>
            <span class="gmeta">${g.books.length} booklets · ≈ ${hrs(mins)} · ${done}/${all} stops</span>
          </div>
          <div class="shelf">${g.books.map(b => {
            const p = bookProgress(b);
            const flags = b.stops.filter(s => stopFlagged(stopId(s))).length;
            return `<button class="bcard${p.pct === 100 ? ' full' : ''}" type="button"
                      style="--h:${b.hue}" data-open-book="${esc(b.key)}">
              <div class="btop">
                <span class="bname">${esc(b.name.replace(g.name + ' · ', ''))}</span>
                <span class="tag ${b.state === 'empty' ? 'warn' : b.state === 'pair' ? 'flag' : b.state === 'hands' ? 'acc' : ''}">${esc(STATE[b.state].label)}</span>
              </div>
              <div class="bbar"><i style="width:${p.pct}%"></i></div>
              <div class="bmeta">≈ ${b.min} min · ${p.done}/${p.total} stops${flags ? ` · <b>${flags} flagged</b>` : ''}</div>
            </button>`;
          }).join('')}</div>
        </section>`;
      }).join('');
    })()}
  </div>`;
}

/* ----------------------------------------------------------------- booklet */
function bookletView() {
  const b = BOOK[bk.book];
  if (!b) { bk.book = null; return shelfView(); }
  bk.pos = Math.max(0, Math.min(bk.pos, b.stops.length - 1));
  const stop = b.stops[bk.pos];
  const id = stopId(stop);
  const p = bookProgress(b);
  const last = bk.pos === b.stops.length - 1;
  const idx = D.booklets.findIndex(x => x.key === b.key);
  const next = D.booklets[idx + 1];

  return `<div class="wrap" style="--h:${b.hue}">
    <div class="prog">
      <button class="crumb" type="button" data-mode="shelf">← all booklets</button>
      <div class="bar"><i style="width:${Math.round(((bk.pos + 1) / b.stops.length) * 100)}%"></i></div>
      <div class="meta"><b>${esc(b.name)}</b><span class="est">≈ ${b.min} min</span><span class="sp">${bk.pos + 1}/${b.stops.length}</span></div>
    </div>

    ${bk.pos === 0 ? `<div class="intro">
      <p>${esc(b.blurb)}</p>
      <p class="how"><strong>${esc(STATE[b.state].label)}</strong> — ${STATE[b.state].how}</p>
      ${b.state === 'empty' || b.state === 'demo'
        ? '<p class="how warn">Both of those <strong>wipe the database.</strong> Do not run either on data you care about.</p>' : ''}
    </div>` : ''}

    <article class="stop">
      <header>
        <div class="eyebrow">${esc(stop.kind)} · ${esc(id)} · roughly ${Math.max(1, Math.round(stop.min))} min</div>
        <h2>${stop.kind === 'screen' ? `<span class="mono">${esc(stopTitle(stop))}</span>` : esc(stopTitle(stop))}</h2>
        ${stopWhy(stop) ? `<p class="why">${md(stopWhy(stop))}</p>` : ''}
      </header>
      ${stopBody(stop)}
      ${askBlock(stop)}
    </article>

    ${last ? `<div class="booknote">
      <h3>Anything about <em>${esc(b.name)}</em> as a whole?</h3>
      <textarea data-note-for="BOOK::${esc(b.key)}"
        placeholder="Something that spans these stops rather than sitting on one of them">${
        esc(ansFor('BOOK::' + b.key).note || '')}</textarea>
    </div>` : ''}

    <div class="pager">
      <button type="button" data-go="-1" ${bk.pos === 0 ? 'disabled' : ''}>← Back</button>
      ${last
        ? (next ? `<button type="button" class="primary" data-open-book="${esc(next.key)}">Finish → next booklet</button>`
                : '<button type="button" class="primary" data-mode="shelf">Finish</button>')
        : '<button type="button" class="primary" data-go="1">Next →</button>'}
    </div>
    <button class="jumpbtn" type="button" data-jump-toggle aria-expanded="${jumping}">
      ${jumping ? 'Hide the list' : `All ${b.stops.length} stops in this booklet`}
    </button>
    ${jumping ? `<ol class="jumplist">${b.stops.map((s, i) => {
      const sid = stopId(s);
      const mark = stopFlagged(sid) ? 'flag' : stopAnswered(sid) ? 'done' : '';
      return `<li><button type="button" class="jumprow ${mark}${i === bk.pos ? ' here' : ''}" data-jump="${i}">
        <span class="jn">${i + 1}</span>
        <span class="jt">${esc(stopTitle(s))}</span>
        <span class="jm">${stopFlagged(sid) ? '!' : stopAnswered(sid) ? '✓' : ''}</span>
      </button></li>`;
    }).join('')}</ol>` : ''}
    ${findingBox()}
  </div>`;
}

/* ---------------------------------------------------------------- notebook */
const SEV = { broken: 3, wrong: 3, no: 2, off: 2, yes: 1, fine: 0, holds: 0, skip: 0 };
function worstOf(id) {
  const a = ansFor(id);
  let worst = '', score = -1;
  for (const [k, v] of Object.entries(a)) {
    if (k === 'note' || !v) continue;
    const s = SEV[v] ?? 0;
    if (s > score) { score = s; worst = v; }
  }
  return { worst, score };
}
/* An answer on a row inside a stop is a finding like any other. Collected here so
   the notebook and all three markdown scopes carry them. */
function itemAnswers() {
  const out = [];
  for (const [key, a] of Object.entries(bk.ans)) {
    if (!key.includes('::')) continue;
    if (!a.look && !a.note) continue;
    const [owner, item] = key.split('::');
    const sc = owner.startsWith('SC:') ? SCREEN[owner.slice(3)] : null;
    const fl = owner.startsWith('FL:') ? FLOW[owner.slice(3)] : null;
    const al = owner.startsWith('AL:') ? SCREEN[owner.slice(3)] : null;
    let where = 'Every empty state';
    let label = item;
    if (sc) where = `${sc.route} — the pieces on it`;
    if (al) { where = `${al.route} — a popup`; label = `“${item}”`; }
    if (fl) {
      where = `${fl.name} — step ${item.replace(/^S/, '')}`;
      /* Name the step, not just its number — "step 4" is unusable in a report. */
      const step = splitSub(fl.steps).find(s => s.sub === item);
      label = step ? step.text.replace(/\s+/g, ' ') : item;
    }
    out.push({ key, item, label, where, look: a.look || '', note: a.note || '' });
  }
  return out.sort((x, y) => (x.look === 'broken' ? -1 : 1) - (y.look === 'broken' ? -1 : 1));
}

function exportMarkdown() {
  const rows = [];
  for (const b of D.booklets) for (const s of b.stops) {
    const id = stopId(s);
    if (!stopAnswered(id) && !ansFor(id).note) continue;
    rows.push({ b, s, id, ...worstOf(id) });
  }
  const out = ['# Walkthrough feedback', ''];
  const total = D.booklets.reduce((n, b) => n + b.stops.length, 0);
  out.push(`${rows.length} of ${total} stops answered.`, '');
  const groups = [[3, 'Broken'], [2, 'Off'], [1, 'Still true'], [0, 'Fine']];
  for (const [score, title] of groups) {
    const g = rows.filter(r => r.score === score);
    if (!g.length) continue;
    out.push(`## ${title} (${g.length})`, '');
    for (const r of g) {
      const a = ansFor(r.id);
      out.push(`**${r.id} · ${stopTitle(r.s)}**  ·  _${r.b.name}_`);
      const answered = Object.entries(a).filter(([k, v]) => k !== 'note' && v)
        .map(([k, v]) => `${Q[k] ? Q[k].q : k} ${v}`);
      if (answered.length) out.push(answered.join(' · '));
      if (r.s.kind === 'flow' && (score >= 2) && FLOW[r.s.id].numbers) {
        const first = String(FLOW[r.s.id].numbers).split('·').map(x => x.trim()).filter(Boolean)[0];
        if (first) out.push(`Expected: ${first.replace(/[*`]/g, '')}`);
      }
      if (a.note) out.push(`Note: ${a.note}`);
      out.push('');
    }
  }
  const bookNotes = D.booklets
    .map(b => ({ b, note: (ansFor('BOOK::' + b.key).note || '').trim() }))
    .filter(x => x.note);
  if (bookNotes.length) {
    out.push(`## On a booklet as a whole (${bookNotes.length})`, '');
    for (const x of bookNotes) out.push(`**${x.b.name}**`, x.note, '');
  }
  const items = itemAnswers();
  if (items.length) {
    out.push(`## Individual screens and pieces (${items.length})`, '');
    for (const i of items) {
      const name = i.label || (SCREEN[i.item] ? SCREEN[i.item].route : i.item);
      out.push(`- **${name}** — ${i.look || 'noted'}${i.note ? ` — ${i.note}` : ''}  _(${i.where})_`);
    }
    out.push('');
  }
  if (bk.finds.length) {
    out.push(`## Things I noticed myself (${bk.finds.length})`, '');
    for (const f of bk.finds) out.push(`- ${f.text}${f.where ? `  _(at ${f.where})_` : ''}`);
    out.push('');
  }
  if (!rows.length && !bk.finds.length) out.push('_Nothing walked yet._');
  out.push(...stateBlock());
  return out.join('\n');
}

/* Everything above is prose, and prose does not round-trip. This block does: the
   answers exactly as stored, so pasting the file back into another browser
   restores the walk rather than approximating it. `localStorage` is per-browser,
   so without this a walk started on a laptop cannot be finished on a phone. */
function stateBlock() {
  const payload = JSON.stringify({ v: 2, ans: bk.ans, finds: bk.finds });
  return [
    '---',
    '',
    '<!-- Paste this whole file back into the walkthrough (Markdown → Restore) to',
    '     put these answers into another browser. Everything below is machine-read. -->',
    '',
    '```bsw-state',
    payload,
    '```',
    '',
  ];
}

/** Pull the state out of a pasted file — or out of a bare JSON blob. */
function readState(text) {
  const fenced = String(text).match(/```bsw-state\s*([\s\S]*?)```/);
  const raw = fenced ? fenced[1] : String(text);
  const start = raw.indexOf('{');
  if (start < 0) return null;
  try {
    const parsed = JSON.parse(raw.slice(start, raw.lastIndexOf('}') + 1));
    if (!parsed || typeof parsed.ans !== 'object') return null;
    return { ans: parsed.ans || {}, finds: Array.isArray(parsed.finds) ? parsed.finds : [] };
  } catch (_) { return null; }
}
function notebookView() {
  const rows = [];
  for (const b of D.booklets) for (const s of b.stops) {
    const id = stopId(s);
    if (!stopAnswered(id) && !ansFor(id).note) continue;

  const g = score => rows.filter(r => r.score === score);
  const card = r => `<div class="nbrow j" data-goto="${esc(r.b.key)}|${r.b.stops.indexOf(r.s)}">
    <div class="top"><b>${esc(stopTitle(r.s))}</b>
      <span class="tag ${r.score >= 3 ? 'warn' : r.score === 2 ? 'flag' : r.score === 1 ? 'acc' : 'ok'}">${esc(r.worst)}</span>
      <span class="id">${esc(r.id)}</span></div>
    <div class="note" style="color:var(--ink-3);font-size:12.5px">${esc(r.b.name)}</div>
    ${ansFor(r.id).note ? `<div class="note">${esc(ansFor(r.id).note)}</div>` : ''}
  </div>`;
  return `<div class="wrap">
    <section class="hero">
      <h1>Your notebook</h1>
      <p>Everything you answered or wrote down. None of it leaves this device until you send it.</p>
      <p class="route-out"><strong>Getting it out:</strong> press <em>Copy everything</em>, then paste
         it into the chat. It gets written to <code>docs/walkthrough-feedback.md</code> in the repo,
         so it lands in git rather than your downloads folder. There is no download button because
         this viewer makes page-initiated saves do nothing — if the copy fails, press
         <em>Show the markdown</em> and select it by hand.</p>
      <div class="stat">
        <div><b>${g(3).length}</b>broken</div><div><b>${g(2).length}</b>off</div>
        <div><b>${bk.finds.length}</b>your own</div><div><b>${rows.length}</b>answered</div>
      </div>
      <div class="act">
        <button type="button" class="primary" data-copy>Copy everything</button>
        <button type="button" data-mode="markdown">Everything as markdown</button>
        <button type="button" data-add-find>＋ Add a finding</button>
        <button type="button" data-mode="shelf">Back to the booklets</button>
        <button type="button" class="danger${confirming ? ' armed' : ''}" data-reset>${
          confirming ? 'Tap again to erase everything' : 'Start over'}</button>
      </div>
    </section>
    ${findingBox()}
    ${(() => {
      const notes = D.booklets.map(b => ({ b, note: (ansFor('BOOK::' + b.key).note || '').trim() }))
        .filter(x => x.note);
      return notes.length ? `<div class="nb"><h3 class="nbh">On a booklet as a whole (${notes.length})</h3>
        ${notes.map(x => `<div class="nbrow j" data-goto="${esc(x.b.key)}|${x.b.stops.length - 1}">
          <div class="top"><b>${esc(x.b.name)}</b></div>
          <div class="note">${esc(x.note)}</div></div>`).join('')}</div>` : '';
    })()}
    ${(() => { const items = itemAnswers(); return items.length
      ? `<div class="nb"><h3 class="nbh">Individual screens and pieces (${items.length})</h3>
         ${items.map(i => `<div class="nbrow"><div class="top">
           <b>${esc(i.label || (SCREEN[i.item] ? SCREEN[i.item].route : i.item))}</b>
           <span class="tag ${i.look === 'broken' ? 'warn' : i.look === 'fine' ? 'ok' : ''}">${esc(i.look || 'noted')}</span>
           <span class="id">${esc(i.where)}</span></div>
           ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}</div>`).join('')}</div>`
      : ''; })()}
    ${bk.finds.length ? `<div class="nb"><h3 class="nbh">Things you noticed yourself</h3>
      ${bk.finds.map((f, i) => `<div class="nbrow"><div class="top"><b>${esc(f.text)}</b>
        <button class="xbtn" type="button" data-drop-find="${i}" aria-label="Remove">✕</button></div>

    ${[[3, 'Broken'], [2, 'Off'], [1, 'Still true'], [0, 'Fine']]
      .filter(([s]) => g(s).length)
      .map(([s, t]) => `<div class="nb"><h3 class="nbh">${t} (${g(s).length})</h3>${g(s).map(card).join('')}</div>`)
      .join('') || (bk.finds.length ? '' : '<p class="empty">Nothing yet. Open a booklet and start walking.</p>')}

}

/* ------------------------------------------------------------- the markdown
 *
 * The whole artifact as one plain-text document. Three scopes, because three
 * different things are worth having: what you found, the walkthrough itself, or
 * both interleaved so a reader who was not there can follow what you meant.
 */
let mdScope = 'all';
const MD_SCOPES = [
  ['answers', 'What I found', 'Only the stops you answered or wrote on.'],
  ['walk', 'The walkthrough', 'Every booklet and every stop, with nothing of yours in it.'],
  ['all', 'Everything', 'The walkthrough with your answers written in where you gave one.'],
];

/** `· a · b` → markdown bullets. Strips the ids that only make sense on screen. */
function mdList(v, indent = '') {
  const parts = String(v || '').split('·').map(x => x.trim()).filter(Boolean);
  return parts.map(x => `${indent}- ${plain(x).replace(/\s+/g, ' ')}`);
}
function mdSteps(v, indent = '') {
  const parts = splitSub(v);
  return parts.map((p, i) =>
    `${indent}${p.sub ? p.sub.replace(/^[A-Z]+/, '') + '.' : (i + 1) + '.'} ${plain(p.text).replace(/\s+/g, ' ')}`);
}
const mdField = (label, v) => v ? [`**${label}** ${plain(String(v)).replace(/\s+/g, ' ')}`, ''] : [];

function stopMarkdown(stop) {
  const out = [];
  if (stop.kind === 'flow') {
    const f = FLOW[stop.id];
    out.push(...mdField('Why', f.trigger));
    out.push(...mdField('You need', f.state));
    if (f.entry) { out.push('**Start from**', ...mdSteps(f.entry), ''); }
    if (f.steps) { out.push('**Do this**', ...mdSteps(f.steps), ''); }
    out.push(...mdField('Should happen', [f.writes, f.exit].filter(Boolean).join(' ')));
    if (f.numbers) { out.push('**Check the numbers**', ...mdList(f.numbers), ''); }
    if (f.failures) { out.push('**Watch out for**', ...mdSteps(f.failures), ''); }
    if (f.alsoTry) { out.push('**Also try**', ...mdList(f.alsoTry), ''); }
    out.push(...mdField('If it went wrong', [f.reversible, f.problems].filter(Boolean).join(' ')));
  } else if (stop.kind === 'screen') {
    const s = SCREEN[stop.id];
    out.push(...mdField('Open', `\`${s.route}\` — ${s.entries === 0 ? 'deep link only'
      : s.entries === 1 ? 'one way in' : `${s.entries} ways in`}`));
    out.push(...mdField('What it is for', s.purpose));
    if (stop.parts && stop.parts.length) {
      out.push('**The pieces on it**', ...stop.parts.map(p => `- \`${p}\``), '');
    }
    if (stop.popups && stop.popups.length) {
      out.push(`**Popups it can raise** (${stop.popups.length})`,
        ...stop.popups.map(x => `- "${x}"`), '');
    }
    out.push('**Look for**',
      '- the empty state — designed, or a blank?',
      '- anything cut off, overlapping, or too small to tap',
      '- the back button — does it go where you expect?', '');
    out.push(...mdField('Known', s.note));
  } else if (stop.kind === 'rule') {
    const v = RULE[stop.id];
    out.push(...mdField('The rule', v.rule));
    out.push(...mdField('Who holds it', /unenforced/i.test(v.heldBy)
      ? 'Nothing does. Held by people remembering, which is why it is here.' : v.heldBy));
  } else if (stop.kind === 'problem') {
    const o = PROB[stop.id];
    out.push(...mdField('The finding', o.title));
    out.push(...mdField('What it costs today', o.cost));
    out.push(...mdField('Verdict', `${(VERDICT[o.verdict] || ['', o.verdict])[1]} — ${o.verdictNote || ''}`));
    out.push(...mdField('What would fix it', o.collapse));
  } else if (stop.kind === 'decision') {
    const d = DEC[stop.id];
    out.push(...mdField('The question', d.q));
    out.push(...mdField(d.group === 'blocked' ? 'Waiting on' : 'If nobody decides', d.fallback));
    out.push(...mdField(d.group === 'blocked' ? 'Effect today' : 'What would force it', d.trigger));
  } else {
    out.push('**With the app wiped, open everything.** Every list is empty right now, and this is',
      'the only time you will see that.', '');
  }
  return out;
}

function answerMarkdown(id) {
  const a = ansFor(id);
  const said = Object.entries(a).filter(([k, v]) => k !== 'note' && v)
    .map(([k, v]) => `${Q[k] ? Q[k].q : k} **${v}**`);
  const out = [];
  if (said.length) out.push(`> ${said.join(' · ')}`);
  if (a.note) out.push(`> `, `> ${a.note.split('\n').join('\n> ')}`);
  if (out.length) out.push('');
  return out;
}

function fullMarkdown(scope) {
  const stamp = new Date().toISOString().slice(0, 10);
  const total = D.booklets.reduce((n, b) => n + b.stops.length, 0);
  const answered = D.booklets.reduce((n, b) =>
    n + b.stops.filter(s => stopAnswered(stopId(s)) || ansFor(stopId(s)).note).length, 0);

  if (scope === 'answers') return exportMarkdown();

  const out = [
    '# BudgetSplit — the walkthrough',
    '',
    `Generated ${stamp} from \`docs/SYSTEM.md\`.`,
    `${D.booklets.length} booklets · ${total} stops · ${answered} answered.`,
    `Estimated ${Math.round(D.time.total / 60)} hours in total — a rough figure, worked out from`,
    'how much each stop asks of you.',
    '',
    'Every screen, task, component, rule, known problem and open question in the app appears',
    'here exactly once. Blockquotes are what was found while walking it.',
    '',
    '---',
    '',
  ];
  for (const b of D.booklets) {
    const p = bookProgress(b);
    out.push(`## ${b.name}`, '');
    out.push(`_${b.blurb}_`, '');
    out.push(`\`${STATE[b.state].label}\` · about ${b.min} min · ${p.done}/${p.total} walked`, '');
    const bn = scope === 'all' ? (ansFor('BOOK::' + b.key).note || '').trim() : '';
    if (bn) out.push(`> ${bn.split('\n').join('\n> ')}`, '');
    for (const s of b.stops) {
      const id = stopId(s);
      out.push(`### ${stopTitle(s)}  \`${id}\``, '');
      out.push(...stopMarkdown(s));
      if (scope === 'all') out.push(...answerMarkdown(id));
    }
    out.push('---', '');
  }
  if (scope === 'all') {
    const items = itemAnswers();
    if (items.length) {
      out.push('## Individual screens and pieces', '');
      for (const i of items) {
        const name = i.label || (SCREEN[i.item] ? SCREEN[i.item].route : i.item);
        out.push(`- **${name}** — ${i.look || 'noted'}${i.note ? ` — ${i.note}` : ''}  _(${i.where})_`);
      }
      out.push('');
    }
  }
  if (scope === 'all' && bk.finds.length) {
    out.push('## Things I noticed myself', '');
    for (const f of bk.finds) out.push(`- ${f.text}${f.where ? `  _(at ${f.where})_` : ''}`);
    out.push('');
  }
  if (scope === 'all') out.push(...stateBlock());
  return out.join('\n');
}

let mdCache = { scope: null, text: '', stamp: 0 };
function markdownView() {
  /* Rebuilding 118 KB of text on every render is what made this view drag. It only
     changes when the scope changes or you answer something. */
  const stamp = Object.keys(bk.ans).length + bk.finds.length;
  if (mdCache.scope !== mdScope || mdCache.stamp !== stamp) {
    mdCache = { scope: mdScope, text: fullMarkdown(mdScope), stamp };
  }
  const text = mdCache.text;
  const kb = (text.length / 1024).toFixed(0);
  const scope = MD_SCOPES.find(s => s[0] === mdScope);
  return `<div class="wrap">
    <section class="hero">
      <h1>The whole thing, as markdown</h1>
      <p>One document you can read here or take away. There is no download button because this
         viewer makes page-initiated saves do nothing — so copy it, or select it below.
         Paste it into the chat and it becomes <code>docs/walkthrough-feedback.md</code> in the repo.</p>
      <div class="navrow" style="margin-top:14px">${MD_SCOPES.map(([k, label]) =>
        `<button class="chip" type="button" data-md-scope="${k}" aria-pressed="${k === mdScope}">${esc(label)}</button>`).join('')}</div>
      <p class="route-out" style="margin-top:12px"><strong>${esc(scope[1])}</strong> — ${esc(scope[2])}
         <br>About ${kb} KB of text.</p>
      <div class="act">
        <button type="button" class="primary" data-copy-md>Copy all of it</button>
        <button type="button" data-mode="shelf">Back to the booklets</button>
      </div>
    </section>
    <div class="mdbox"><textarea readonly data-md>${esc(text)}</textarea></div>

    <div class="restorebox">
      <h3>Continuing on another device?</h3>
      <p>This browser cannot see what you answered somewhere else — <code>localStorage</code> is
         per-browser. Paste a file exported from there (the <em>Everything</em> scope carries your
         answers; the others do not) and it can pick up where that one left off.</p>
      ${!restoring ? `<div class="act"><button type="button" data-restore-open>Paste a file to restore</button></div>` : `
        <textarea data-restore-in placeholder="Paste the whole file here, including the fenced block at the end"></textarea>
        <div class="act">
          <button type="button" class="primary" data-restore-check>Check it</button>
          <button type="button" data-restore-cancel>Cancel</button>
        </div>
        ${restoreFound ? `
          <div class="restorefound">
            <p><strong>Found ${Object.keys(restoreFound.ans).length} answer${Object.keys(restoreFound.ans).length === 1 ? '' : 's'}</strong>
               and ${restoreFound.finds.length} finding${restoreFound.finds.length === 1 ? '' : 's'} in that file.</p>
            <p class="warn-text">This <strong>replaces everything</strong> in this browser — your
               current answers here are not merged, they are gone.</p>
            <div class="act">
              <button type="button" class="danger${restoreArmed ? ' armed' : ''}" data-restore-apply>${
                restoreArmed ? 'Tap again to replace everything' : 'Replace everything with this'}</button>
            </div>
          </div>` : (restoring && restoreFound === false ? `<p class="warn-text">That does not look like a walkthrough
              export — no <code>bsw-state</code> block found. Make sure you pasted the whole file,
              fenced block included.</p>` : '')}
      `}
    </div>
  </div>`;
}

/* "Look something up" — the reference, with every section described. Sixteen
   unlabelled chips told you nothing about what was behind any of them. */
const LOOKUP_NOTE = {
  problems:  'Duplication and overload, each with a verdict and what it would cost to fix.',
  decisions: 'Questions nobody has answered, and what happens if nobody ever does.',
  rules:     'Things that must never be false. Nine have a test; the rest are held by memory.',
  scenarios: 'What happens when it goes wrong — ordinary, then two people, then bad input, then the cases the database allows and the screens forbid.',
  reference: 'How to cite something, what the app is for, what leaves the device, and what a delete actually destroys.',
};
function lookupView() {
  const card = (k, name, note, n) =>
    `<button class="bcard" type="button" data-mode="${k}">
      <div class="btop"><span class="bname">${esc(name)}</span>${n ? `<span class="tag">${n}</span>` : ''}</div>
      <div class="bmeta bnote">${esc(note)}</div>
    </button>`;
  return `<div class="wrap">
    <section class="hero">
      <h1>Look something up</h1>
      <p>The reference half. Nothing here asks you to do anything — it is for when a figure confuses
         you mid-walk, or you want to know what a word means before you trust it.</p>
    </section>
    <h3 class="nbh">By what the app does</h3>
    <div class="shelf">${D.AREAS.map(a => card(a.key, a.name, a.blurb,
      a.fl.length + a.sc.length)).join('')}</div>
    <h3 class="nbh">Across the whole app</h3>
    <div class="shelf">${Object.entries(CROSS).map(([k, c]) =>
      card(k, c.label, LOOKUP_NOTE[k] || '', c.n || 0)).join('')}</div>
  </div>`;
}

const CROSS = {
  problems: {
    label: 'Problems', n: D.ovs.length,
    view: q => {
      const order = ['COLLAPSE', 'COLLAPSE-AFTER-PILOT', 'RENAME-ONLY', 'KEEP-DOCUMENTED', 'NEEDS-DECISION'];
      const heads = { 'COLLAPSE': 'Fix these', 'COLLAPSE-AFTER-PILOT': 'Fix after the pilot',
        'RENAME-ONLY': 'Only the names are wrong', 'KEEP-DOCUMENTED': 'Looks wrong, is fine',
        'NEEDS-DECISION': 'Cannot fix until something is decided' };
      const items = D.ovs.filter(o => match(o, q));
      return `<section class="hero"><h1>What's confusing, and what to do</h1>
          <p>Twenty-seven findings. Twelve of them need no code at all — the app is less over-built
             than it feels and more under-named.</p>
          <div class="stat">
            <div><b>4</b>fix now</div><div><b>5</b>after the pilot</div>
            <div><b>12</b>naming only</div><div><b>6</b>need a decision</div>
          </div></section>
        ${order.map(v => {
          const g = items.filter(o => o.verdict === v);
          return group(heads[v], g.length, g.map(ovItem).join(''), v === 'COLLAPSE' || !!q);
        }).join('')}`;
    },
  },
  decisions: {
    label: 'Decisions', n: D.dqs.length,
    view: q => {
      const heads = { product: 'Product and business', technical: 'Technical',
        blocked: 'Waiting on someone else' };
      const items = D.dqs.filter(d => match(d, q));
      return `<section class="hero"><h1>What has not been decided</h1>
          <p>Thirty questions, twenty-nine still open. Each says what happens if nobody ever answers
             it — because most will not be answered, and the default is what ships.</p></section>
        ${['product', 'technical', 'blocked'].map(gk => {
          const g = items.filter(d => d.group === gk);
          return group(heads[gk], g.length, g.map(dqItem).join(''), gk === 'product' || !!q);
        }).join('')}`;

  },
  rules: {

    view: q => {
